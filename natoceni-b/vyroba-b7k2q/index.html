<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Suchdol B · výroba videa</title>
<style>
@font-face{font-family:Switzer;src:url(font/Switzer-Variable.ttf) format("truetype");font-weight:100 900;font-display:swap}
:root{--ink:#16130f;--paper:#f6f1e8;--card:#fffdf8;--line:#e2d9c8;--mute:#6f675b;--wine:#7a1f2b;--gold:#b08a4a;--ok:#2f7a4f;--okbg:#e6f1e9;--warn:#9a6b1f;--warnbg:#f7edd6;--badbg:#f4e0e2}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 Switzer,-apple-system,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
.top{padding:22px 0 10px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--wine);font-weight:600}
h1{font-size:32px;line-height:1.1;margin:4px 0 6px;font-weight:700}
.top p{margin:0;color:var(--mute);font-size:15px;max-width:60ch}
/* lišta kroků */
.nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;background:rgba(246,241,232,.97);margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;border:1.5px solid var(--ink);background:#fff;border-radius:99px;padding:0 15px 0 8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.nav button i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px}
.nav button.on{background:var(--ink);color:#fff}
.nav button.on i{background:#fff;color:var(--ink)}
.nav button.cek{border-color:var(--line);color:var(--mute);border-style:dashed}
.nav button.cek i{background:var(--line);color:var(--mute)}
/* kroky */
.krok{margin:14px 0;scroll-margin-top:70px}
.kh{width:100%;display:flex;align-items:center;gap:14px;min-height:64px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.kh:hover{border-color:var(--gold)}
.kh .kn{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700}
.krok.cek .kn{background:var(--line);color:var(--mute)}
.kh .tt{flex:1;min-width:0}
.kh .tt b{display:block;font-size:20px;line-height:1.2}
.kh .tt span{font-size:13.5px;color:var(--mute)}
.kh .chev{flex:none;width:12px;height:12px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg);transition:transform .35s;margin:0 4px 4px 0}
.krok.open .chev{transform:rotate(-135deg);margin:4px 4px 0 0}
.krok.open .kh{border-color:var(--ink)}
.st{flex:none;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--okbg);color:var(--ok)}
.krok.cek .st{background:var(--line);color:var(--mute)}
.kb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.3,.7,.2,1)}
.krok.open .kb{grid-template-rows:1fr}
.kb>.in{min-height:0;overflow:hidden;visibility:hidden;transition:visibility 0s .5s}
.krok.open .kb>.in{visibility:visible;transition:visibility 0s}
.kbi{padding:18px 0 6px}
.cekej{border:2px dashed var(--line);border-radius:16px;padding:34px 18px;text-align:center;color:var(--mute);background:linear-gradient(100deg,transparent 30%,rgba(176,138,74,.09) 50%,transparent 70%) 0 0/250% 100%;animation:shim 3.2s linear infinite}
.cekej b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
@keyframes shim{to{background-position:-250% 0}}
/* patra */
.pt{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.pt button{min-height:48px;border:1.5px solid var(--ink);background:#fff;border-radius:14px;padding:6px 18px;cursor:pointer;text-align:left;transition:background .2s,color .2s}
.pt button b{display:block;font-size:17px;line-height:1.15}
.pt button small{font-size:12px;opacity:.7}
.pt button.on{background:var(--ink);color:#fff}
.patro{display:none}
.patro.in{animation:fadeup .5s cubic-bezier(.3,.7,.2,1) both}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.plan{position:relative;width:100%;max-width:980px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.plan>img{display:block;width:100%;height:auto;transition:filter .3s}
.plan svg{position:absolute;inset:0;width:100%;height:100%}
.rm{fill:rgba(176,138,74,.13);stroke:var(--gold);stroke-width:2.5;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .25s,stroke .25s,opacity .25s}
.rm:hover{fill:rgba(176,138,74,.32)}
.plan.sel .rm{fill:rgba(246,241,232,.78);stroke:rgba(176,138,74,.5)}
.plan.sel .rm.on{fill:rgba(122,31,43,.16);stroke:var(--wine);stroke-width:4}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:7px;min-height:30px;border:0;border-radius:99px;background:var(--ink);color:#fff;padding:0 4px 0 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:opacity .25s,background .25s,transform .25s}
.pin em{font-style:normal;display:grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:800}
.pin:hover{transform:translate(-50%,-50%) scale(1.06)}
.plan.sel .pin{opacity:.5}
.plan.sel .pin.on{opacity:1;background:var(--wine)}
.plan.sel .pin.on em{background:#fff;color:var(--wine)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;justify-content:center}
.chips button{min-height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:0 6px 0 14px;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s}
.chips button em{font-style:normal;display:grid;place-items:center;min-width:26px;height:26px;border-radius:99px;background:var(--line);font-size:13px}
.chips button.on{background:var(--wine);border-color:var(--wine);color:#fff}
.chips button.on em{background:#fff;color:var(--wine)}
.galh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 8px;min-height:44px}
.galh h3{margin:0;font-size:22px;line-height:1.15}
.galh .sub{color:var(--mute);font-size:14px}
.galh button{margin-left:auto;min-height:44px;border:1.5px solid var(--ink);background:#fff;border-radius:99px;padding:0 16px;font-weight:600;cursor:pointer}
.grp{margin:12px 0 22px}
.grp>h4{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}
.grp>h4 button{border:0;background:none;padding:6px 0;min-height:44px;margin:-6px 0;text-transform:inherit;letter-spacing:inherit;font-weight:700;color:var(--wine);cursor:pointer;font-size:13px;text-align:left}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ph{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;animation:pop .5s cubic-bezier(.3,.7,.2,1) both;animation-delay:calc(var(--i,0)*60ms);transition:border-color .2s,box-shadow .2s}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.ph .th{display:block;width:100%;padding:0;border:0;background:#e9e1d3;cursor:zoom-in;aspect-ratio:3/2;position:relative}
.ph .th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s,opacity .3s}
.ph .th:hover img{transform:scale(1.03)}
.ph .th .nr{position:absolute;left:8px;top:8px;background:rgba(22,19,15,.72);color:#fff;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;letter-spacing:.04em}
.ph .th .vz{position:absolute;right:8px;top:8px;background:var(--gold);color:var(--ink);font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 7px}
.ph .bd{padding:10px 12px 12px}
.ph .pop{margin:0 0 9px;font-size:14.5px;line-height:1.35}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);border-radius:11px;overflow:hidden}
.seg button{min-height:44px;border:0;border-right:1.5px solid var(--ink);background:#fff;font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,color .15s}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true][data-s=p]{background:var(--ok);color:#fff}
.seg button[aria-pressed=true][data-s=u]{background:var(--gold);color:var(--ink)}
.seg button[aria-pressed=true][data-s=v]{background:var(--wine);color:#fff}
.opt{display:flex;align-items:center;gap:10px;margin-top:9px}
.sw{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-size:13.5px;font-weight:600;user-select:none}
.sw input{appearance:none;-webkit-appearance:none;width:44px;height:26px;margin:0;border-radius:99px;background:#d8cfbd;position:relative;cursor:pointer;transition:background .2s;flex:none}
.sw input:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked{background:var(--gold)}
.sw input:checked:after{transform:translateX(18px)}
.nt{flex:1;min-width:0;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;font-size:14px;background:#fff}
.nt:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.ph.s-u{border-color:var(--gold);box-shadow:0 0 0 2px rgba(176,138,74,.25)}
.ph.s-v{border-color:var(--wine)}
.ph.s-v .th img,.ph.s-v .pop{opacity:.42}
/* odeslání */
.send{margin:30px 0 0;background:var(--ink);color:#fff;border-radius:18px;padding:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cnt{display:flex;gap:18px;flex-wrap:wrap;flex:1;min-width:230px}
.cnt div b{display:block;font-size:28px;line-height:1}
.cnt div span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:48px;border-radius:99px;border:1.5px solid #fff;background:transparent;color:#fff;font-weight:700;font-size:16px;padding:0 22px;cursor:pointer}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}
.msg{flex-basis:100%;display:none;border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
.msg.ok{display:block;background:var(--okbg);color:var(--ok)}
.msg.err{display:block;background:var(--badbg);color:var(--wine)}
.msg.nfo{display:block;background:#33302a;color:#fff}
/* lupa */
.lb{position:fixed;inset:0;z-index:100;display:none;background:rgba(14,12,9,.985);color:#fff;touch-action:pan-y}
.lb.show{animation:lbin .25s both}
@keyframes lbin{from{opacity:0}to{opacity:1}}
.lb .stg{position:absolute;inset:0 0 86px 0;display:grid;place-items:center;padding:56px 56px 8px}
.lb img{max-width:100%;max-height:100%;object-fit:contain;display:block;transition:opacity .2s}
.lb .cap{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 18px;text-align:center;min-height:86px}
.lb .cap b{display:block;font-size:15px}
.lb .cap span{font-size:14px;opacity:.8}
.lb .cap small{display:block;opacity:.5;margin-top:2px}
.lb button{position:absolute;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:26px;cursor:pointer;display:grid;place-items:center;line-height:1}
.lb button:hover{background:rgba(255,255,255,.28)}
.lb .x{top:10px;right:10px}.lb .pv{left:8px;top:50%;margin-top:-52px}.lb .nx{right:8px;top:50%;margin-top:-52px}
@media(max-width:640px){.lb .stg{padding:56px 0 8px}.lb .pv,.lb .nx{top:auto;bottom:78px;margin:0;background:rgba(255,255,255,.2)}.lb .pv{left:10px}.lb .nx{right:10px}.lb .cap{padding:12px 70px 16px}}
/* obecné karty kroků 2–6 */
.pary{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:18px}
.par{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.par h3{margin:2px 4px 10px;font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.par .ch{font-size:12px;background:var(--okbg);color:var(--ok);border-radius:99px;padding:2px 9px;font-weight:700}
.cmp{position:relative;border-radius:10px;overflow:hidden;background:#e9e1d3;user-select:none;touch-action:pan-y}
.cmp img{display:block;width:100%;height:auto}
.cmp .top2{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:inset(0 0 0 var(--x,50%))}
.cmp .ln{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.4);pointer-events:none}
.cmp .tg{position:absolute;top:10px;font-size:12px;font-weight:800;border-radius:6px;padding:3px 8px;background:rgba(22,19,15,.75);color:#fff}
.cmp .tg.a{left:10px}.cmp .tg.b{right:10px;background:var(--gold);color:var(--ink)}
.cmp input{position:absolute;left:0;right:0;bottom:6px;width:100%;margin:0;height:44px;background:none;-webkit-appearance:none;appearance:none;cursor:ew-resize}
.cmp input::-webkit-slider-runnable-track{height:44px;background:transparent}
.cmp input::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:5px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.cmp input::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.galm{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.galm button{padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);cursor:zoom-in;text-align:left}
.galm img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.galm span{display:block;padding:8px 12px;font-size:14px;font-weight:600}
.gk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.gk h4{margin:0 0 6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.gk ul{margin:0;padding-left:20px}
.gk img.gi{display:block;max-width:100%;border-radius:8px;margin:6px 0}
.kv{display:grid;grid-template-columns:minmax(80px,max-content) 1fr;gap:3px 12px;font-size:14.5px;margin:4px 0}
.kv>span:nth-child(odd){color:var(--mute)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:14.5px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.tbl img{width:160px;max-width:100%;border-radius:6px;display:block}
.tw{overflow-x:auto}
.md{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 20px 14px;max-width:820px}
.md h3,.md h4,.md h5{margin:18px 0 6px}
.md p,.md li{font-size:15.5px}
.foot{margin-top:34px;font-size:12px;color:var(--mute)}
@media(max-width:640px){
  h1{font-size:26px}.pary{grid-template-columns:1fr}
  .pin{padding:0;min-height:0;background:transparent;box-shadow:none}
  .pin span{display:none}
  .pin em{min-width:30px;height:30px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.35);background:var(--ink);color:#fff}
  .plan.sel .pin.on em{background:var(--wine);color:#fff}
  .grid{grid-template-columns:1fr}
  .kh .tt b{font-size:18px}.kh .st{display:none}
  .send{padding:16px}
  .tbl img{width:110px}
}
/* sekce uvnitř kroků */
.dt{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px}
.dt>summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:18px}
.dt>summary::-webkit-details-marker{display:none}
.dt>summary small{font-weight:500;font-size:13.5px;color:var(--mute);margin-left:auto;text-align:right}
.dt>summary:after{content:"";flex:none;width:10px;height:10px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg);margin:0 4px 4px 8px;transition:transform .3s}
.dt[open]>summary:after{transform:rotate(-135deg);margin:4px 4px 0 8px}
.dt[open]>summary{border-bottom:1px solid var(--line)}
.dt>.dtb{padding:14px 16px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 12px}
.box.warn{background:var(--warnbg);border-color:#e3cf9d}
.box b.lab{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.box.warn b.lab{color:var(--warn)}
.qbox{border:2px solid var(--gold);background:var(--warnbg);border-radius:16px;padding:16px 20px;margin:0 0 14px}
.qbox h3{margin:0 0 8px;font-size:22px}
.qbox ol{margin:0;padding-left:24px}.qbox li{font-size:17px;margin:6px 0}
.stepl{margin:0;padding-left:22px}.stepl li{margin:6px 0}
/* krok 5 */
.nclist{display:grid;gap:16px;max-width:980px}
.nc{background:var(--bg2,#fff);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.nc .hd{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.nc .hd h3{margin:0;font-size:19px}
.idc{flex:none;background:var(--ink);color:#fff;font-size:12.5px;font-weight:800;border-radius:7px;padding:3px 9px;letter-spacing:.04em}
.strip{display:block;width:100%;padding:0;border:0;background:#1d1a16;cursor:zoom-in}
.strip img{display:block;width:100%;height:auto;min-height:48px;object-fit:cover}
.vq{margin:0;padding:16px 18px 6px;font-size:25px;line-height:1.3;font-weight:600;color:var(--ink)}
.nc .kv{padding:6px 18px 16px}
.nsm{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr));gap:14px}
.nsm .nc .hd{padding:10px 12px 6px}.nsm .nc p{margin:0;padding:10px 12px 12px;font-size:15px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--mute)}
.vohead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 12px}
.vohead span{color:var(--mute);font-size:14.5px}
.vohead .btn2{margin-left:auto}
.btn2{min-height:48px;border-radius:99px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;font-size:16px;padding:0 22px;cursor:pointer}
.btn2.ghost{background:#fff;color:var(--ink)}
.btn2:hover{opacity:.9}
.vo{display:grid;grid-template-columns:44px 1fr;gap:4px 14px;padding:14px 0;border-top:1px solid var(--line)}
.vo:first-of-type{border-top:0}
.vo .num{width:40px;height:40px;border-radius:50%;background:var(--wine);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.vo .tx{font-size:20px;line-height:1.4;font-weight:500}
.vo .mt{color:var(--mute);font-size:13.5px;margin-top:4px}
.vo .mt .idc{margin-right:6px;font-size:11px;padding:2px 7px}
.vo .pn{margin-top:6px;font-size:13.5px;background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 10px}
.cpmsg{display:none;margin-top:10px;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--okbg);color:var(--ok)}
.cpmsg.on{display:block}
/* krok 4 */
.smery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px;margin:0 0 16px}
.sm{position:relative;text-align:left;min-height:48px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.sm:hover{border-color:var(--gold)}
.sm[aria-selected=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.sm .id{font-size:12px;font-weight:800;letter-spacing:.06em;background:var(--ink);color:#fff;border-radius:6px;padding:2px 8px}

ie.jpg", "nazev": "03 axonometrie"}, {"src": "img/model_listy/03_axonometrie_nahled.jpg", "nahled": "img/model_listy/n_03_axonometrie_nahled.jpg", "nazev": "03 axonometrie nahled"}, {"src": "img/model_listy/04_rozlozena_podlazi.jpg", "nahled": "img/model_listy/n_04_rozlozena_podlazi.jpg", "nazev": "04 rozlozena podlazi"}, {"src": "img/model_listy/04_rozlozena_podlazi_nahled.jpg", "nahled": "img/model_listy/n_04_rozlozena_podlazi_nahled.jpg", "nazev": "04 rozlozena podlazi nahled"}], "chybi": "<h3>Dům B – co je odhad, jak moc to vadí, a co si vyžádat od p. Sládka (15. 11. 2026)<\/h3>\n<h4>Odhady v modelu (od největšího vlivu)<\/h4>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>#<\/th><th>co<\/th><th>hodnota v modelu<\/th><th>z čeho<\/th><th>nejistota<\/th><th>dopad na video<\/th><\/tr><\/thead><tbody><tr><td data-l=\"#\">1<\/td><td data-l=\"co\"><b>Výšky podlaží a střechy<\/b><\/td><td data-l=\"hodnota v modelu\">1.PP ±0,00 · 1.NP +3,00 · 2.NP +6,15 · okap +9,20 · hřeben +10,30<\/td><td data-l=\"z čeho\">fotky P1194788/P1194771 (PnP), dron<\/td><td data-l=\"nejistota\">±0,2–0,3 m<\/td><td data-l=\"dopad na video\">střední – „rozebírání“ domu po patrech, výšky v titulcích nesmí zaznít bez potvrzení<\/td><\/tr><tr><td data-l=\"#\">2<\/td><td data-l=\"co\"><b>Písečná baterie pod domem<\/b><\/td><td data-l=\"hodnota v modelu\">kvádr 7,4 × 5,3 × 1,1 m pod garáží a garsonkou<\/td><td data-l=\"z čeho\">jen „v ceně, pod domem“<\/td><td data-l=\"nejistota\">poloha i velikost neznámé<\/td><td data-l=\"dopad na video\"><b>velký<\/b> – hlavní efekt scény „Dům ve 3D“<\/td><\/tr><tr><td data-l=\"#\">3<\/td><td data-l=\"co\"><b>Terén zahrady, dvora a ulice<\/b><\/td><td data-l=\"hodnota v modelu\">dvůr 0,0 · sever +1,3 · zahrada +0,8 → +2,6 · ulice +1,3<\/td><td data-l=\"z čeho\">fotky, dron šikmo<\/td><td data-l=\"nejistota\">±0,5 m, sklon zahrady nejistý<\/td><td data-l=\"dopad na video\">střední – záběry zahrady a bazénu, nástřely kamer<\/td><\/tr><tr><td data-l=\"#\">4<\/td><td data-l=\"co\"><b>Poloha bazénu<\/b><\/td><td data-l=\"hodnota v modelu\">3 × 6 m, X −19,8…−16,8, Y 3,8…9,8<\/td><td data-l=\"z čeho\">dron 0742_12, P1194788<\/td><td data-l=\"nejistota\">±0,7 m<\/td><td data-l=\"dopad na video\">střední<\/td><\/tr><tr><td data-l=\"#\">5<\/td><td data-l=\"co\"><b>Technika: rekuperační jednotka, rozvody VZT, stoupačka<\/b><\/td><td data-l=\"hodnota v modelu\">jednotka pod stropem garáže, stoupačka u schodiště<\/td><td data-l=\"z čeho\">objímky VZT pod stropem garáže (P1184094)<\/td><td data-l=\"nejistota\">poloha neznámá<\/td><td data-l=\"dopad na video\">střední (scéna V ceně)<\/td><\/tr><tr><td data-l=\"#\">6<\/td><td data-l=\"co\"><b>Venkovní schodiště na balkon 1.NP<\/b><\/td><td data-l=\"hodnota v modelu\">podle b_05 na severním konci balkonu<\/td><td data-l=\"z čeho\">výkres + zadání; na fotkách 14. 11. u B není<\/td><td data-l=\"nejistota\">poloha<\/td><td data-l=\"dopad na video\">malý–střední<\/td><\/tr><tr><td data-l=\"#\">7<\/td><td data-l=\"co\">Tvar vnitřních schodišť<\/td><td data-l=\"hodnota v modelu\">rovné rameno v zóně z výkresu (reálně se zákruty)<\/td><td data-l=\"z čeho\">výkresy, fotky<\/td><td data-l=\"nejistota\">tvar<\/td><td data-l=\"dopad na video\">malý (jen řezy)<\/td><\/tr><tr><td data-l=\"#\">8<\/td><td data-l=\"co\">Garážová vrata<\/td><td data-l=\"hodnota v modelu\">3,0 m (výkres 3,7 m)<\/td><td data-l=\"z čeho\">fotky<\/td><td data-l=\"nejistota\">±0,4 m<\/td><td data-l=\"dopad na video\">malý<\/td><\/tr><tr><td data-l=\"#\">9<\/td><td data-l=\"co\">Plochy: garsonka vychází 10,7 m² proti 13,74 m² ve výkresu; balkon 2.NP V vychází 16 m² proti 10 m²<\/td><td data-l=\"hodnota v modelu\">výkres nesedí sám se sebou<\/td><td data-l=\"z čeho\"><\/td><td data-l=\"nejistota\">malý (obrys domu sedí)<\/td><\/tr><tr><td data-l=\"#\">10<\/td><td data-l=\"co\">Pootočení domu vůči světovým stranám<\/td><td data-l=\"hodnota v modelu\">nezadáno<\/td><td data-l=\"z čeho\"><\/td><td data-l=\"nejistota\"><\/td><td data-l=\"dopad na video\">pro kamery podle dronu a slunce<\/td><\/tr><tr><td data-l=\"#\">11<\/td><td data-l=\"co\">Budoucí FVE, TČ, žaluzie, zastřešení bazénu<\/td><td data-l=\"hodnota v modelu\">návrh rozmístění<\/td><td data-l=\"z čeho\">odpovědi 9. 11. (ceny)<\/td><td data-l=\"nejistota\">umístění<\/td><td data-l=\"dopad na video\">střední (scéna Na přání)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Měřítka výkresů (z ploch místností): b_04 75,9 px/m (rozptyl 73–78), b_05 78,5 (obývák 48,8 m² sedí na −0,7 %), b_07 76,5 (74,9–80,8).<\/p>\n<p>Výsledný dům 10,30 × 7,10 m, rozdíl mezi výkresy ±1 %. Místnosti: garáž −0,9 %, obývák −0,7 %, ložnice +0,4 %, koupelna 2.NP −1,2 %,<\/p>\n<p>pokoje −3,8 % / +3,4 %, chodba 1.PP +2,2 %, koupelna 1.PP +4 %, zádveří −7,5 %, garsonka −22 % (viz bod 9).<\/p>\n<h4>Suterén (1.PP) – co na něm podle fotek a dronu je (k ověření u p. Sládka)<\/h4>\n<ul>\n<li><b>Technický kout s kotlem<\/b>: nástěnný plynový kotel v nice v garáži u stěny ke garsonce (P1184110, P1184094, P1184098); u něj<\/li>\n<\/ul>\n<p>  rozvody, expanzomat, rozvaděč/zásuvky. Ve výkresu b_04 je tato nika bílý obdélník, ve 3D pohledu b_09 je na stejném místě <b>sauna<\/b>.<\/p>\n<ul>\n<li><b>Sauna – příprava?<\/b> V nice garáže stojí karton s piktogramem sauny (P1184094, P1184098). Infrasauna podle odpovědí NENÍ v ceně<\/li>\n<\/ul>\n<p>  („cca 40 000 Kč“). <b>Otázka: má být sauna v nice (jako b_09), nebo v garsonce? Je tam připravená elektřina?<\/b><\/p>\n<ul>\n<li><b>Zásobník teplé vody<\/b>: bílý válcový zásobník volně stojí v garsonce u dveří (P1184133, P1184138). **Otázka: je to jeho konečné<\/li>\n<\/ul>\n<p>  místo, nebo se přesune do technické niky?**<\/p>\n<ul>\n<li><b>Rekuperace<\/b>: pod stropem garáže jsou kruhové objímky a vývody VZT (P1184094, P1184104) – jednotku Licon jsme proto dali<\/li>\n<\/ul>\n<p>  pod strop garáže. <b>Otázka: kde přesně bude jednotka a kudy vedou sání a výfuk?<\/b><\/p>\n<ul>\n<li>Garáž: sekční vrata s pohonem (P1184104), betonová podlaha; zádveří se vstupem z dvora (P1184089); koupelna se sprchou a WC<\/li>\n<\/ul>\n<p>  (P1184118, sanita v obalech); chodba se schodištěm (P1184145).<\/p>\n<ul>\n<li>Kde je <b>elektrorozvaděč<\/b>? Na fotkách jsou rozvaděče v chodbě 2.NP (P1194851) – v modelu tam je Loxone.<\/li>\n<\/ul>\n<h4>Podklady, o které požádat p. Sládka (a k čemu)<\/h4>\n<ol>\n<li><b>Okótované půdorysy všech podlaží (PDF/DWG)<\/b> – přesné zdi a otvory místo odvození z ploch (dnes ±1 %, místy výkres nesedí sám se sebou).<\/li>\n<li><b>Řez domem (příčný i podélný) s výškovými kótami<\/b> – výšky podlaží, tloušťky stropů, výška okapu a hřebene; scéna „řez domem“ a titulky.<\/li>\n<li><b>Pohledy na všechny 4 fasády<\/b> – kontrola oken (parapety, nadpraží), tvaru střechy a štítů.<\/li>\n<li><b>Skladba a sklon střechy<\/b> – tloušťka, sklon, atika/oplechování; nutné pro rozmístění FVE ve scéně „Na přání“.<\/li>\n<li><b>Písečná baterie: kde přesně pod domem, rozměry, hloubka, jak je napojená (registr, teplota)<\/b> – hlavní efekt scény „Dům ve 3D“.<\/li>\n<li><b>Umístění rekuperační jednotky, trasy VZT, výústky<\/b> – animace rozvodů.<\/li>\n<li><b>Umístění kotle, zásobníku TUV, rozvaděče a Loxone<\/b> – popisky „V ceně“.<\/li>\n<li><b>Kde bude tepelné čerpadlo (venkovní jednotka) a kudy kabely FVE k baterii a střídači<\/b> – scéna „Na přání“.<\/li>\n<li><b>Situace / výškopis pozemku (hranice, výškové kóty dvora, zahrady, ulice, poloha bazénu)<\/b> – terén v modelu a kamery na zahradě.<\/li>\n<li><b>Potvrzení venkovního schodiště od ulice na balkon 1.NP (poloha, kdy bude hotové)<\/b> – na fotkách 14. 11. zatím není.<\/li>\n<li><b>Výška a typ zábradlí (shodné s A)<\/b> a <b>typ zastřešení bazénu a žaluzií<\/b> – vzhled ve scénách.<\/li>\n<li><b>Sauna: kde (nika v garáži, nebo garsonka) a co je připravené<\/b> – viz suterén.<\/li>\n<\/ol>", "porovnani": "<h3>Dům B – kontrola modelu proti skutečným fotkám (15. 11. 2026)<\/h3>\n<p>Kamera ke každé fotce je dopočítaná z bodů na fasádě (PnP: rohy roletových boxů, okenní rámy, hrany balkonových desek, rohy okapu<\/p>\n<p>→ jejich 3D poloha z <code>plan.json<\/code>). Pak je model vyrenderovaný ze stejného místa a položený přes fotku.<\/p>\n<p>Listy: <code>porovnani/&lt;fotka&gt;_porovnani.jpg<\/code> (fotka | model | prolnutí | tmavé hrany modelu přes fotku, zelená = bod na fotce, červená = bod modelu).<\/p>\n<p>Kamery: <code>porovnani/kamery.json<\/code>. Fotky jsou z Fotella po korekci svislic → nejsou to čisté „dírkové“ snímky, proto zbývá chyba.<\/p>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>fotka<\/th><th>co ukazuje<\/th><th>chyba kamery (RMS z 2560 px)<\/th><th>verdikt<\/th><\/tr><\/thead><tbody><tr><td data-l=\"fotka\"><b>P1194788<\/b> západní fasáda se zahradou<\/td><td data-l=\"co ukazuje\">1.PP/1.NP/2.NP, terasy, sloupy, střecha z boku<\/td><td data-l=\"chyba kamery (RMS z 2560 px)\">16 px (≈ 0,6 %)<\/td><td data-l=\"verdikt\"><b>dům sedí<\/b> – podlaží, okna, desky balkonů, sloupy, okap; <b>terén a bazén nesedí<\/b><\/td><\/tr><tr><td data-l=\"fotka\"><b>P1194771<\/b> severní štít<\/td><td data-l=\"co ukazuje\">2 okna 1.NP, komínek, štít<\/td><td data-l=\"chyba kamery (RMS z 2560 px)\">6 px (≈ 0,25 %)<\/td><td data-l=\"verdikt\"><b>sedí velmi dobře<\/b> – okna ±3 px, roh okapu ±3 px<\/td><\/tr><tr><td data-l=\"fotka\"><b>P1194761<\/b> od ulice (SV roh)<\/td><td data-l=\"co ukazuje\">garáž, východní balkony, štít<\/td><td data-l=\"chyba kamery (RMS z 2560 px)\">36 px<\/td><td data-l=\"verdikt\">jen orientačně – fotka je silně deformovaná (15 mm + korekce), kamera nejde přesně spočítat<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Co sedí<\/h4>\n<ul>\n<li><b>Půdorys / rozměr domu 10,30 × 7,10 m<\/b> – okna na severní a západní fasádě padnou na fotku do ±0,3 m vodorovně.<\/li>\n<li><b>Výšky podlaží<\/b>: roletové boxy nad okny 1.PP, 1.NP a 2.NP jsou na P1194788 ve stejných rozestupech (207 a 211 px) → podlahy<\/li>\n<\/ul>\n<p>  ±0,00 / +3,00 / +6,15 m; svislé odchylky bodů do 8 px (≈ 10 cm).<\/p>\n<ul>\n<li><b>Okap +9,20 m<\/b>: dvě nezávislé fotky (P1194788 i P1194771) dávají nejmenší chybu při okapu 9,1–9,4 m.<\/li>\n<li><b>Střecha<\/b>: sedlová, hřeben S–J uprostřed, štít na severu – sedí na P1194771 (šikmá hrana štítu k SZ rohu) i na dronu<\/li>\n<\/ul>\n<p>  (nataceni 2, LRF 0742 12–24 s: dvě sedlové střechy A a B, hřeben u obou S–J). Rendery developera b_00–02 mají jiný tvar – nepoužity.<\/p>\n<ul>\n<li><b>Okna<\/b>: 1.NP sever 2 velká okna (sloupek s komínkem mezi nimi), západ 1.NP celá prosklená stěna, 2.NP západ velké francouzské<\/li>\n<\/ul>\n<p>  okno ložnice + malé okno koupelny, 1.PP západ okno + dveře garsonky + okno koupelny (parapety 1,05 m – P1184133, P1184118);<\/p>\n<p>  severní štít 1.PP a 2.NP bez oken. Počty souhlasí na všech fotkách.<\/p>\n<ul>\n<li><b>Balkony a terasy<\/b>: západní terasa 1.NP na dvou sloupech, balkon 2.NP nad ní, desky ve správných výškách; východní balkony<\/li>\n<\/ul>\n<p>  (lichoběžník podél ulice) odpovídají dronu i P1194761.<\/p>\n<ul>\n<li><b>Komínek<\/b> (nerez, odkouření kotle) uprostřed mezi okny severní fasády, nad střechu.<\/li>\n<\/ul>\n<h4>Co nesedí / je nejisté<\/h4>\n<ol>\n<li><b>Terén zahrady a bazén (P1194788)<\/b> – v modelu je bazén menší a dál od kamery než na fotce. Z kamery vychází, že fotograf stál<\/li>\n<\/ol>\n<p>   ~4–5 m nad podlahou 1.PP, tedy zahrada k západu stoupá (v modelu +0,8 → +2,6 m, odhad). Poloha bazénu je z dronu (±0,7 m), na fotce<\/p>\n<p>   se nedá spolehlivě dopočítat, protože není znám sklon terénu. <b>Pro záběry zahrady potřebujeme výškopis/situaci (viz CHYBI.md).<\/b><\/p>\n<ol>\n<li><b>Venkovní schodiště od ulice na balkon 1.NP<\/b> – v modelu podle výkresu b_05 a zadání (Franta 15. 11.: „skutečný stav“) na<\/li>\n<\/ol>\n<p>   severním konci balkonu. <b>Na fotkách 14. 11. (P1194761) ani na dronu (0742_21) u domu B zatím není<\/b>; podobné schodiště má<\/p>\n<p>   dům A na svém jižním konci. Nutno potvrdit polohu u p. Sládka.<\/p>\n<ol>\n<li><b>Dům A<\/b> je jen hmota (o 0,4 m nižší, 1,3 m vystupuje k ulici, 2 m kratší do zahrady) – na fotkách má A vlastní terasy a sloupy.<\/li>\n<li><b>Zábradlí<\/b> – v modelu už „jako dům A“ (antracitové sloupky, madlo, čiré sklo). Na fotkách je u B zatím zabalené ve fólii.<\/li>\n<li><b>Garážová vrata<\/b> – výkres kreslí otvor 3,7 m, fotky ukazují užší → v modelu 3,0 m (odhad).<\/li>\n<li><b>Sklon střechy<\/b> (~12°, hřeben +10,30) je z dronu a jedné fotky; ±0,3 m.<\/li>\n<li><b>Pootočení vůči světovým stranám<\/b> není určeno (model je ve „výkresovém severu“) – pro přesné kamery podle dronu bude potřeba<\/li>\n<\/ol>\n<p>   natočit podle GPS (SRT) nebo ortofota.<\/p>"}, "strih": {"aktualizace": "2026-11-15 15:43", "smery": [{"id": "S1", "nazev": "Čistá DNA", "veta": "Scénář přesně v pořadí, tvrdé střihy v pohybu a 8 ramp – měřítko, proti kterému se poznají druhé dva.", "video": "img/strih/S1/smer1_web.mp4", "poster": "img/strih/S1/poster/001.jpg", "delka_s": 88.24, "hudba": "FD knihovna – „A modern hybrid piano composition…“ (df238fc4, 129 BPM), od 26,5 s: tři klavírní údery pod údolím, plný nástup přesně na nálet (13,0 s filmu); filmová, s jasným nástupem", "dna": {"zabery": 40, "zabery_min": 27.2, "median_s": 1.6, "prvni_zaber_s": 1.6, "strihy_v_pohybu_pct": 87, "rampy": 8, "titulku": 13, "titulky_cas_pct": 44, "udery": 18, "lufs": -14.0}, "plusy": ["Nejbezpečnější: přesně scénář, čitelné pořadí pasáží", "8 ramp na průjezdech, žádná na Evě; 87 % střihů v pohybu (odhad z měření)", "Jasný nástup hudby na nálet, Eva v celých větách"], "minusy": ["Nejméně překvapí – Franta chtěl „moderní skladbu a efekty“", "3D pasáž (7 s ze zástupných renderů) zatím tahá tempo dolů", "Klavírní hudba – Franta u eventů klavír odmítal (u reality nejistá)"], "zabery": [{"n": 1, "od": 0.0, "do": 1.6, "pasaz": "Údolí", "klip": "DJI_20261114115521_0697_D", "zdroj_od": 3.0, "zdroj_do": 4.56, "rychlost": "1,0×", "efekt": "", "prechod": "tvrdý", "zvuk": "potok + hudba", "stitek": null, "nahled": "img/strih/S1/ ák za Evou se po schválení stillu udělá přes 3D z Blenderu + AI video (Genjutsu nebo Kling Omni). Vlastní skládání z masky zůstává jako bezplatná záloha a pro záběry venku ze stativu.", "kroky": ["1. Střih a výběr záběru (hotovo: poslední pokusy).", "2. Franta záběr nabarví nebo schválí barvy.", "3. Still ze směru záběru v 5 stylových variantách přes ChatGPT, rozmístění z 3D modelu podle výkresu (běží) → Franta vybere.", "4. Blender: nástřel kamery a Eviny trasy ze stejného místa (layout + clay), aby AI držela prostor i při švenku.", "5. AI video: zdrojový záběr + schválený still jako reference prostoru. Nejdřív jeden krátký zkušební klip, cena předem.", "6. Kontrola tváře a stavby proti zdroji, štítek „Vizualizace“."], "placene": "Krok 5 je placený (Genjutsu 49–140 kreditů za ~6 s podle rozlišení; Kling Omni se nacení před testem). Doporučení: začít Genjutsu, protože drží tvář (u Vanguardu Omni změnil Honzovi obličej); Omni zkusit jen jako srovnání, protože Eva je v tomhle záběru dál od kamery. Spouští se až po Frantově „jo“."}, "otazky": ["Kam má vést odkaz a QR na koncové kartě (inzerát, nebo stránka na maklerkaeva.cz)?", "Sauna v suterénu: je to ten technický kout v garáži vedle kotle, kde stojí v kartonu?", "Kdy Eva namluví komentář (5 vět, dohromady asi 30 s)?", "Schodiště od ulice na balkon 1.NP u domu B zatím na fotkách ani z dronu není – v modelu je podle výkresu na severním konci balkonu. Sedí to tak?"]}, "podklady": "<h3>Žádost o podklady pro 3D model – KONCEPT, NEODESLÁNO<\/h3>\n<p>Čeká na Frantovo schválení. Odeslat z honza@frantisekdron.cz na j.sladek@seznam.cz (nebo přes WhatsApp), až Franta řekne.<\/p>\n<p>K e-mailu se přiloží schvalovací listy modelu (<code>model3d/schvaleni/Schvaleni_dum_B.pdf<\/code>), pokud je Franta odsouhlasí.<\/p>\n<p><b>Předmět:<\/b> Vyhlídky Suchdol B – 3D model domu ke schválení a výkresy<\/p>\n<p>Dobrý den, pane Sládku,<\/p>\n<p>pro video jsme postavili 3D model domu B – ukážeme v něm řez domem a co je v ceně a co na přání           var ix=lbl.findIndex(function(q){return q.src===t.screenshot});sh.onclick=function(){lbOpen(lbl,Math.max(0,ix))};r.appendChild(sh)}
        else r.appendChild(el('div','shot no','bez snímku'));
        var tb=el('button','tbtn',tc(t.od)+' – '+tc(t.do));tb.type='button';tb.setAttribute('aria-label','Přetočit video na '+tc(t.od));tb.onclick=function(){seek(t.od)};r.appendChild(tb);
        var tx=el('div','tx');tx.appendChild(el('b','',t.text||''));if(t.typ)tx.appendChild(el('span','',t.typ));r.appendChild(tx);
        tl.appendChild(r);S4.rows.push({e:r,od:t.od,do:t.do});
      });
      panel.appendChild(tl);
    }
    /* záběry */
    var zb=s.zabery||[];
    if(zb.length){
      panel.appendChild(el('h3','kr-h','Záběry · '+zb.length));
      var zs=el('div','zst');
      zb.forEach(function(z){
        var b=el('button','zb');b.type='button';b.setAttribute('aria-label','Záběr '+z.n+', přetočit na '+tc(z.od));
        if(z.nahled){var im=el('img');im.src=z.nahled;im.loading='lazy';im.alt='Záběr '+z.n;b.appendChild(im)}else b.appendChild(el('div','ni'));
        var bd=el('div','zbd');var tt=el('span','t',tc(z.od)+' – '+tc(z.do));bd.appendChild(tt);
        bd.appendChild(el('b','','#'+z.n+(z.pasaz?' · '+z.pasaz:'')));
        if(z.klip)bd.appendChild(el('span','mono',String(z.klip).replace(/^DJI_\d+_/,'')));
        var ef=[z.efekt,z.prechod].filter(Boolean).join(' → ');if(ef){bd.appendChild(document.createElement('br'));bd.appendChild(document.createTextNode(ef))}
        b.appendChild(bd);b.onclick=function(){seek(z.od)};zs.appendChild(b);S4.rows.push({e:b,od:z.od,do:z.do});
      });
      panel.appendChild(zs);
    }
  }
  /* společné */
  if(d.komentar&&d.komentar.length){
    body.appendChild(el('h3','kr-h','Komentář'));
    var kw=el('div','kom');
    d.komentar.forEach(function(x){var g=el('div','gk');var h=el('h4','',x.id||'');if(x.stav)h.appendChild(el('span','stv',' '+x.stav));g.appendChild(h);g.appendChild(el('p','',x.text||''));kw.appendChild(g)});
    body.appendChild(kw);
  }
  if(d.pasaze&&d.pasaze.length){
    body.appendChild(el('h3','kr-h','Postup ke každé pasáži'));
    var tw=el('div','tw'),t=el('table','tbl rsp'),th=el('tr');
    ['Pasáž','Zdroj','Co se schvaluje','Výroba','Placené'].forEach(function(x){th.appendChild(el('th','',x))});
    var hd=el('thead');hd.appendChild(th);t.appendChild(hd);var tb=el('tbody');
    d.pasaze.forEach(function(p){var tr=el('tr');
      [['Pasáž',p.nazev||p.pasaz],['Zdroj',p.zdroj],['Co se schvaluje',p.schvalit],['Výroba',p.vyroba],['Placené',p.placene]].forEach(function(a){var td=el('td','',a[1]===undefined?'':String(a[1]));td.dataset.l=a[0];tr.appendChild(td)});
      tb.appendChild(tr)});
    t.appendChild(tb);tw.appendChild(t);body.appendChild(tw);
  }
  /* odeslání výběru směru */
  var sd=el('div','send');
  var cn=el('div','cnt');var dd=el('div');var bb=el('b','','–');bb.id='c4s';dd.appendChild(bb);dd.appendChild(el('span','','Vybraný směr'));cn.appendChild(dd);sd.appendChild(cn);
  var bt=el('div','btns');var snd=el('button','btn pri','Odeslat výběr směru');snd.type='button';snd.id='send4';
  var cp=el('button','btn','Kopírovat souhrn');cp.type='button';bt.appendChild(snd);bt.appendChild(cp);sd.appendChild(bt);
  var mg=el('div','msg');mg.id='msg4';mg.setAttribute('role','status');mg.setAttribute('aria-live','polite');sd.appendChild(mg);body.appendChild(sd);
  function souhrn4(){
    var L=['Suchdol B · střih · výběr směru'];var ch=smery.filter(function(s){return s.id===sv.smer})[0];
    L.push(ch?'VYBRÁNO: '+smerNazev(ch)+(ch.delka_s?' ('+Math.round(ch.delka_s)+' s)':''):'Směr zatím nevybrán');
    if(ch&&sv.n[ch.id])L.push('Poznámka: '+sv.n[ch.id]);
    var o=smery.filter(function(s){return s.id!==sv.smer&&sv.n[s.id]});
    if(o.length){L.push('','Poznámky k ostatním směrům:');o.forEach(function(s){L.push('- '+s.id+' '+(s.nazev||'')+': '+sv.n[s.id])})}
    return L.join('\n');
  }
  window.__souhrn4=souhrn4;
  cnt4=function(){var ch=smery.filter(function(s){return s.id===sv.smer})[0];bb.textContent=ch?ch.id:'–'};
  snd.onclick=function(){if(!sv.smer){note('err','Nejdřív vyber směr (tlačítko „Vybrat tento směr“).','#msg4');return}odeslat(snd,{text:souhrn4(),title:'Suchdol B · střih · výběr směru',msg:'#msg4',label:'Odeslat výběr směru',tags:['clapper','white_check_mark']})};
  cp.onclick=function(){var t=souhrn4();var done=function(){note('ok','Souhrn je zkopírovaný ✓','#msg4')};(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done,function(){prompt('Zkopíruj:',t)})};
  var start=Math.max(0,smery.findIndex(function(s){return s.id===sv.smer}));
  showSmer(start);
}
var cnt4=function(){};

/* ---------- krok 5: vstupy Evy ---------- */

  var pasy=[];

    var src=isImg(it.nahled)?it.nahled.__img:null;if(!src)return null;
    var im=el('img');im.src=src;im.loading='lazy';im.alt='Pás náhledů klipu '+(it.klip||'');bt.appendChild(im);
    var idx=pasy.length;pasy.push({src:src,c1:cap,c2:it.klip||''});bt.onclick=function(){lbOpen(pasy,idx)};return bt;
  }
  if(V.aktualizace){var u=el('p','');u.style.cssText='margin:0 0 12px;color:var(--mute);font-size:13.5px';u.textContent='Stav k '+V.aktualizace;b.appendChild(u)}
  var q=V.otazky;

  if(V.natoceno&&V.natoceno.length)b.appendChild(sect('Natočeno',V.natoceno.length+' vstupy s řečí',true,function(c){
    var w=el('div','nclist');
    V.natoceno.forEach(function(n){
      var a=el('article','nc');var h=el('div','hd');h.appendChild(el('span','idc',n.id||''));h.appendChild(el('h3','',n.kde||''));a.appendChild(h);
      var s=strip(n,(n.id||'')+' · '+(n.kde||''));if(s)a.appendChild(s);
      if(n.veta)a.appendChild(el('p','vq','„'+n.veta+'“'));
      var kv=el('div','kv');[['Klip',n.klip],['Pokusů',n.pokusu],['Poznámka',n.pozn]].forEach(function(r){if(r[1]!==undefined&&r[1]!==''){kv.appendChild(el('span','',r[0]));kv.appendChild(el('span','',String(r[1])))}});a.appendChild(kv);
      w.appendChild(a)});
    c.appendChild(w)}));
  if(V.bez_reci&&V.bez_reci.length)b.appendChild(sect('Záběry bez řeči',V.bez_reci.length+' klipy',true,function(c){
    var w=el('div','nsm');
    V.bez_reci.forEach(function(n){var a=el('article','nc');var h=el('div','hd');h.appendChild(el('span','mono',n.klip||''));a.appendChild(h);
      var s=strip(n,'Záběr bez řeči');if(s)a.appendChild(s);a.appendChild(el('p','',n.co||''));w.appendChild(a)});
    c.appendChild(w)}));
  var nm=V.namluvit;
  if(nm&&nm.length){var tot=nm.reduce(function(a,x){return a+(+x.delka_s||0)},0);
    b.appendChild(sect('Text k namluvení pro Evu',nm.length+' vět · asi '+Math.round(tot)+' s',true,function(c){
      var hd=el('div','vohead');hd.appendChild(el('span','',nm.length+' vět, dohromady asi '+Math.round(tot)+' s'));
      var cb=el('button','btn2','Kopírovat text pro Evu');cb.type='button';hd.appendChild(cb);c.appendChild(hd);
      var cm=el('div','cpmsg');cm.setAttribute('role','status');cm.setAttribute('aria-live','polite');c.appendChild(cm);
      nm.forEach(function(x,i){
        var r=el('div','vo');r.appendChild(el('div','num',String(i+1)));var rb=el('div','');
        rb.appendChild(el('div','tx',x.text||''));
        var mt=el('div','mt');mt.appendChild(el('span','idc',x.id||''));mt.appendChild(document.createTextNode((x.kam||'')+(x.delka_s?' · asi '+x.delka_s+' s':'')));rb.appendChild(mt);
        if(x.pozn)rb.appendChild(el('div','pn','Poznámka pro nás: '+x.pozn));
        r.appendChild(rb);c.appendChild(r)});
      cb.onclick=function(){var t=nm.map(function(x,i){return (i+1)+'. '+x.text}).join('\n');window.__textEva=t;copyText(t,cb,cm,'Zkopírováno: '+nm.length+' vět, očíslované, bez poznámek.')};
    }))}
  if(V.nenatoceno&&V.nenatoceno.length)b.appendChild(sect('Nenatočeno','',false,function(c){var u=el('ul','stepl');V.nenatoceno.forEach(function(x){u.appendChild(el('li','',x))});c.appendChild(u)}));
  var vd=V.vymena_domu;
  if(vd)b.appendChild(sect('Výměna domu za Evou','',false,function(c){
    if(vd.rozhodnuti){var r=el('div','box');r.appendChild(el('b','lab','Rozhodnutí'));r.appendChild(el('div','',vd.rozhodnuti));c.appendChild(r)}
    if(vd.kroky&&vd.kroky.length){var ol=el('ol','stepl');vd.kroky.forEach(function(x){ol.appendChild(el('li','',String(x).replace(/^\s*\d+[.)]\s*/,'')))});c.appendChild(ol)}
    if(vd.placene){var p=el('div','box warn');p.style.marginTop='12px';p.appendChild(el('b','lab','Co je placené'));p.appendChild(el('div','',vd.placene));c.appendChild(p)}
  }));
  var skip={aktualizace:1,natoceno:1,bez_reci:1,namluvit:1,nenatoceno:1,vymena_domu:1,otazky:1},rest={};
  Object.keys(V).forEach(function(x){if(!skip[x])rest[x]=V[x]});
  if(Object.keys(rest).length)gen(rest,b);
}
