<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Suchdol B · výroba videa</title>
<style>
@font-face{font-family:Switzer;src:url(font/Switzer-Variable.ttf) format("truetype");font-weight:100 900;font-display:swap}
:root{--ink:#16130f;--paper:#f6f1e8;--card:#fffdf8;--line:#e2d9c8;--mute:#6f675b;--wine:#7a1f2b;--gold:#b08a4a;--ok:#2f7a4f;--okbg:#e6f1e9;--warn:#9a6b1f;--warnbg:#f7edd6;--badbg:#f4e0e2}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 Switzer,-apple-system,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
.top{padding:22px 0 10px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--wine);font-weight:600}
h1{font-size:32px;line-height:1.1;margin:4px 0 6px;font-weight:700}
.top p{margin:0;color:var(--mute);font-size:15px;max-width:60ch}
/* lišta kroků */
.nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;background:rgba(246,241,232,.97);margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;border:1.5px solid var(--ink);background:#fff;border-radius:99px;padding:0 15px 0 8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.nav button i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px}
.nav button.on{background:var(--ink);color:#fff}
.nav button.on i{background:#fff;color:var(--ink)}
.nav button.cek{border-color:var(--line);color:var(--mute);border-style:dashed}
.nav button.cek i{background:var(--line);color:var(--mute)}
/* kroky */
.krok{margin:14px 0;scroll-margin-top:70px}
.kh{width:100%;display:flex;align-items:center;gap:14px;min-height:64px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.kh:hover{border-color:var(--gold)}
.kh .kn{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700}
.krok.cek .kn{background:var(--line);color:var(--mute)}
.kh .tt{flex:1;min-width:0}
.kh .tt b{display:block;font-size:20px;line-height:1.2}
.kh .tt span{font-size:13.5px;color:var(--mute)}
.kh .chev{flex:none;width:12px;height:12px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg);transition:transform .35s;margin:0 4px 4px 0}
.krok.open .chev{transform:rotate(-135deg);margin:4px 4px 0 0}
.krok.open .kh{border-color:var(--ink)}
.st{flex:none;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--okbg);color:var(--ok)}
.krok.cek .st{background:var(--line);color:var(--mute)}
.kb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.3,.7,.2,1)}
.krok.open .kb{grid-template-rows:1fr}
.kb>.in{min-height:0;overflow:hidden;visibility:hidden;transition:visibility 0s .5s}
.krok.open .kb>.in{visibility:visible;transition:visibility 0s}
.kbi{padding:18px 0 6px}
.cekej{border:2px dashed var(--line);border-radius:16px;padding:34px 18px;text-align:center;color:var(--mute);background:linear-gradient(100deg,transparent 30%,rgba(176,138,74,.09) 50%,transparent 70%) 0 0/250% 100%;animation:shim 3.2s linear infinite}
.cekej b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
@keyframes shim{to{background-position:-250% 0}}
/* patra */
.pt{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.pt button{min-height:48px;border:1.5px solid var(--ink);background:#fff;border-radius:14px;padding:6px 18px;cursor:pointer;text-align:left;transition:background .2s,color .2s}
.pt button b{display:block;font-size:17px;line-height:1.15}
.pt button small{font-size:12px;opacity:.7}
.pt button.on{background:var(--ink);color:#fff}
.patro{display:none}
.patro.in{animation:fadeup .5s cubic-bezier(.3,.7,.2,1) both}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.plan{position:relative;width:100%;max-width:980px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.plan>img{display:block;width:100%;height:auto;transition:filter .3s}
.plan svg{position:absolute;inset:0;width:100%;height:100%}
.rm{fill:rgba(176,138,74,.13);stroke:var(--gold);stroke-width:2.5;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .25s,stroke .25s,opacity .25s}
.rm:hover{fill:rgba(176,138,74,.32)}
.plan.sel .rm{fill:rgba(246,241,232,.78);stroke:rgba(176,138,74,.5)}
.plan.sel .rm.on{fill:rgba(122,31,43,.16);stroke:var(--wine);stroke-width:4}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:7px;min-height:30px;border:0;border-radius:99px;background:var(--ink);color:#fff;padding:0 4px 0 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:opacity .25s,background .25s,transform .25s}
.pin em{font-style:normal;display:grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:800}
.pin:hover{transform:translate(-50%,-50%) scale(1.06)}
.plan.sel .pin{opacity:.5}
.plan.sel .pin.on{opacity:1;background:var(--wine)}
.plan.sel .pin.on em{background:#fff;color:var(--wine)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;justify-content:center}
.chips button{min-height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:0 6px 0 14px;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s}
.chips button em{font-style:normal;display:grid;place-items:center;min-width:26px;height:26px;border-radius:99px;background:var(--line);font-size:13px}
.chips button.on{background:var(--wine);border-color:var(--wine);color:#fff}
.chips button.on em{background:#fff;color:var(--wine)}
.galh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 8px;min-height:44px}
.galh h3{margin:0;font-size:22px;line-height:1.15}
.galh .sub{color:var(--mute);font-size:14px}
.galh button{margin-left:auto;min-height:44px;border:1.5px solid var(--ink);background:#fff;border-radius:99px;padding:0 16px;font-weight:600;cursor:pointer}
.grp{margin:12px 0 22px}
.grp>h4{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}
.grp>h4 button{border:0;background:none;padding:6px 0;min-height:44px;margin:-6px 0;text-transform:inherit;letter-spacing:inherit;font-weight:700;color:var(--wine);cursor:pointer;font-size:13px;text-align:left}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ph{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;animation:pop .5s cubic-bezier(.3,.7,.2,1) both;animation-delay:calc(var(--i,0)*60ms);transition:border-color .2s,box-shadow .2s}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.ph .th{display:block;width:100%;padding:0;border:0;background:#e9e1d3;cursor:zoom-in;aspect-ratio:3/2;position:relative}
.ph .th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s,opacity .3s}
.ph .th:hover img{transform:scale(1.03)}
.ph .th .nr{position:absolute;left:8px;top:8px;background:rgba(22,19,15,.72);color:#fff;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;letter-spacing:.04em}
.ph .th .vz{position:absolute;right:8px;top:8px;background:var(--gold);color:var(--ink);font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 7px}
.ph .bd{padding:10px 12px 12px}
.ph .pop{margin:0 0 9px;font-size:14.5px;line-height:1.35}
.ph .pzn{margin:-5px 0 9px;font-size:12.5px;line-height:1.3;color:var(--mute,#6b6358)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);border-radius:11px;overflow:hidden}
.seg button{min-height:44px;border:0;border-right:1.5px solid var(--ink);background:#fff;font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,color .15s}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true][data-s=p]{background:var(--ok);color:#fff}
.seg button[aria-pressed=true][data-s=u]{background:var(--gold);color:var(--ink)}
.seg button[aria-pressed=true][data-s=v]{background:var(--wine);color:#fff}
.opt{display:flex;align-items:center;gap:10px;margin-top:9px}
.sw{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-size:13.5px;font-weight:600;user-select:none}
.sw input{appearance:none;-webkit-appearance:none;width:44px;height:26px;margin:0;border-radius:99px;background:#d8cfbd;position:relative;cursor:pointer;transition:background .2s;flex:none}
.sw input:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked{background:var(--gold)}
.sw input:checked:after{transform:translateX(18px)}
.nt{flex:1;min-width:0;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;font-size:14px;background:#fff}
.nt:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.ph.s-u{border-color:var(--gold);box-shadow:0 0 0 2px rgba(176,138,74,.25)}
.ph.s-v{border-color:var(--wine)}
.ph.s-v .th img,.ph.s-v .pop{opacity:.42}
/* odeslání */
.send{margin:30px 0 0;background:var(--ink);color:#fff;border-radius:18px;padding:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cnt{display:flex;gap:18px;flex-wrap:wrap;flex:1;min-width:230px}
.cnt div b{display:block;font-size:28px;line-height:1}
.cnt div span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:48px;border-radius:99px;border:1.5px solid #fff;background:transparent;color:#fff;font-weight:700;font-size:16px;padding:0 22px;cursor:pointer}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}
.msg{flex-basis:100%;display:none;border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
.msg.ok{display:block;background:var(--okbg);color:var(--ok)}
.msg.err{display:block;background:var(--badbg);color:var(--wine)}
.msg.nfo{display:block;background:#33302a;color:#fff}
/* lupa */
.lb{position:fixed;inset:0;z-index:100;display:none;background:rgba(14,12,9,.985);color:#fff;touch-action:pan-y}
.lb.show{animation:lbin .25s both}
@keyframes lbin{from{opacity:0}to{opacity:1}}
.lb .stg{position:absolute;inset:0 0 86px 0;display:grid;place-items:center;padding:56px 56px 8px}
.lb img{max-width:100%;max-height:100%;object-fit:contain;display:block;transition:opacity .2s}
.lb .cap{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 18px;text-align:center;min-height:86px}
.lb .cap b{display:block;font-size:15px}
.lb .cap span{font-size:14px;opacity:.8}
.lb .cap small{display:block;opacity:.5;margin-top:2px}
.lb button{position:absolute;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:26px;cursor:pointer;display:grid;place-items:center;line-height:1}
.lb button:hover{background:rgba(255,255,255,.28)}
.lb .x{top:10px;right:10px}.lb .pv{left:8px;top:50%;margin-top:-52px}.lb .nx{right:8px;top:50%;margin-top:-52px}
@media(max-width:640px){.lb .stg{padding:56px 0 8px}.lb .pv,.lb .nx{top:auto;bottom:78px;margin:0;background:rgba(255,255,255,.2)}.lb .pv{left:10px}.lb .nx{right:10px}.lb .cap{padding:12px 70px 16px}}
/* obecné karty kroků 2–6 */
.pary{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:18px}
.par{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.par h3{margin:2px 4px 10px;font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.par .ch{font-size:12px;background:var(--okbg);color:var(--ok);border-radius:99px;padding:2px 9px;font-weight:700}
.cmp{position:relative;border-radius:10px;overflow:hidden;background:#e9e1d3;user-select:none;touch-action:pan-y}
.cmp img{display:block;width:100%;height:auto}
.cmp .top2{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:inset(0 0 0 var(--x,50%))}
.cmp .ln{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.4);pointer-events:none}
.cmp .tg{position:absolute;top:10px;font-size:12px;font-weight:800;border-radius:6px;padding:3px 8px;background:rgba(22,19,15,.75);color:#fff}
.cmp .tg.a{left:10px}.cmp .tg.b{right:10px;background:var(--gold);color:var(--ink)}
.cmp input{position:absolute;left:0;right:0;bottom:6px;width:100%;margin:0;height:44px;background:none;-webkit-appearance:none;appearance:none;cursor:ew-resize}
.cmp input::-webkit-slider-runnable-track{height:44px;background:transparent}
.cmp input::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:5px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.cmp input::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.galm{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.galm button{padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);cursor:zoom-in;text-align:left}
.galm img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.galm span{display:block;padding:8px 12px;font-size:14px;font-weight:600}
.gk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.gk h4{margin:0 0 6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.gk ul{margin:0;padding-left:20px}
.gk img.gi{display:block;max-width:100%;border-radius:8px;margin:6px 0}
.kv{display:grid;grid-template-columns:minmax(80px,max-content) 1fr;gap:3px 12px;font-size:14.5px;margin:4px 0}
.kv>span:nth-child(odd){color:var(--mute)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:14.5px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.tbl img{width:160px;max-width:100%;border-radius:6px;display:block}
.tw{overflow-x:auto}
.md{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 20px 14px;max-width:820px}
.md h3,.md h4,.md h5{margin:18px 0 6px}
.md p,.md li{font-size:15.5px}
.foot{margin-top:34px;font-size:12px;color:var(--mute)}
@media(max-width:640px){
  h1{font-size:26px}.pary{grid-template-columns:1fr}
  .pin{padding:0;min-height:0;background:transparent;box-shadow:none}
  .pin span{display:none}
  .pin em{min-width:30px;height:30px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.35);background:var(--ink);color:#fff}
  .plan.sel .pin.on em{background:var(--wine);color:#fff}
  .grid{grid-template-columns:1fr}
  .kh .tt b{font-size:18px}.kh .st{display:none}
  .send{padding:16px}
  .tbl img{width:110px}
}
/* sekce uvnitř kroků */
.dt{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px}
.dt>summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:18px}
.dt>summary::-webkit-details-marker{display:none}
.dt>summary small{font-weight:500;font-size:13.5px;color:var(--mute);margin-left:auto;text-align:right}
.dt>summary:after{content:"";flex:none;width:10px;height:10px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg);margin:0 4px 4px 8px;transition:transform .3s}
.dt[open]>summary:after{transform:rotate(-135deg);margin:4px 4px 0 8px}
.dt[open]>summary{border-bottom:1px solid var(--line)}
.dt>.dtb{padding:14px 16px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 12px}
.box.warn{background:var(--warnbg);border-color:#e3cf9d}
.box b.lab{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.box.warn b.lab{color:var(--warn)}
.qbox{border:2px solid var(--gold);background:var(--warnbg);border-radius:16px;padding:16px 20px;margin:0 0 14px}
.qbox h3{margin:0 0 8px;font-size:22px}
.qbox ol{margin:0;padding-left:24px}.qbox li{font-size:17px;margin:6px 0}
.stepl{margin:0;padding-left:22px}.stepl li{margin:6px 0}
/* krok 5 */
.nclist{display:grid;gap:16px;max-width:980px}
.nc{background:var(--bg2,#fff);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.nc .hd{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.nc .hd h3{margin:0;font-size:19px}
.idc{flex:none;background:var(--ink);color:#fff;font-size:12.5px;font-weight:800;border-radius:7px;padding:3px 9px;letter-spacing:.04em}
.strip{display:block;width:100%;padding:0;border:0;background:#1d1a16;cursor:zoom-in}
.strip img{display:block;width:100%;height:auto;min-height:48px;object-fit:cover}
.vq{margin:0;padding:16px 18px 6px;font-size:25px;line-height:1.3;font-weight:600;color:var(--ink)}
.nc .kv{padding:6px 18px 16px}
.nsm{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr));gap:14px}
.nsm .nc .hd{padding:10px 12px 6px}.nsm .nc p{margin:0;padding:10px 12px 12px;font-size:15px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--mute)}
.vohead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 12px}
.vohead span{color:var(--mute);font-size:14.5px}
.vohead .btn2{margin-left:auto}
.btn2{min-height:48px;border-radius:99px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;font-size:16px;padding:0 22px;cursor:pointer}
.btn2.ghost{background:#fff;color:var(--ink)}
.btn2:hover{opacity:.9}
.vo{display:grid;grid-template-columns:44px 1fr;gap:4px 14px;padding:14px 0;border-top:1px solid var(--line)}
.vo:first-of-type{border-top:0}
.vo .num{width:40px;height:40px;border-radius:50%;background:var(--wine);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.vo .tx{font-size:20px;line-height:1.4;font-weight:500}
.vo .mt{color:var(--mute);font-size:13.5px;margin-top:4px}
.vo .mt .idc{margin-right:6px;font-size:11px;padding:2px 7px}
.vo .pn{margin-top:6px;font-size:13.5px;background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 10px}
.cpmsg{display:none;margin-top:10px;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--okbg);color:var(--ok)}
.cpmsg.on{display:block}
/* krok 4 */
.smery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px;margin:0 0 16px}
.sm{position:relative;text-align:left;min-height:48px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.sm:hover{border-color:var(--gold)}
.sm[aria-selected=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}

a<\/td><td data-l=\"výška\">37 m<\/td><td data-l=\"náklon\">-22.6°<\/td><td data-l=\"pohled na dům z\">V (kamera míří Z)<\/td><td data-l=\"proč\">Šikmý pohled od ulice/ze SV rohu: obě poloviny dvojdomu, B vpravo s bazénem, zahrada a příjezd. Nižší světlo, ale ostré a nezakryté.<\/td><\/tr><tr><td data-l=\"#\">3<\/td><td data-l=\"snímek\">0684 (11.13.) <code>DJI_20261113160829_0684_D.DNG<\/code><\/td><td data-l=\"orient.\">šířka<\/td><td data-l=\"výška\">54 m<\/td><td data-l=\"náklon\">-16.2°<\/td><td data-l=\"pohled na dům z\">SZ (kamera míří JV)<\/td><td data-l=\"proč\">Pohled od SZ (14° nad horizontem), celý B se zahradou a bazénem, soused A vlevo, zeleň; zlatá hodina 13. 11., kontrastnější.<\/td><\/tr><tr><td data-l=\"#\">4<\/td><td data-l=\"snímek\">0643 (11.13.) <code>DJI_20261113154536_0643_D.DNG<\/code><\/td><td data-l=\"orient.\">šířka<\/td><td data-l=\"výška\">43 m<\/td><td data-l=\"náklon\">-12.1°<\/td><td data-l=\"pohled na dům z\">SZ (kamera míří J)<\/td><td data-l=\"proč\">Pohled ze severu/SZ, bazén dobře vidět, B nezakrytý; dolní roh zabírá střecha sousedního objektu (nemá vliv na B). Tmavší (13. 11.).<\/td><\/tr><tr><td data-l=\"#\">5<\/td><td data-l=\"snímek\">0677 (11.13.) <code>DJI_20261113160658_0677_D.DNG<\/code><\/td><td data-l=\"orient.\">šířka<\/td><td data-l=\"výška\">37 m<\/td><td data-l=\"náklon\">-15.2°<\/td><td data-l=\"pohled na dům z\">V (kamera míří Z)<\/td><td data-l=\"proč\">Od ulice/ze V, B s bazénem, zahrada; dole zasahuje větev stromu (nutno vyretušovat/oříznout).<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Skupina 2: Výška (9:16) – reely a stories<\/h4>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>#<\/th><th>snímek<\/th><th>orient.<\/th><th>výška<\/th><th>náklon<\/th><th>pohled na dům z<\/th><th>proč<\/th><\/tr><\/thead><tbody><tr><td data-l=\"#\">1<\/td><td data-l=\"snímek\">0752 (11.14.) <code>DJI_20261114120745_0752_D.DNG<\/code><\/td><td data-l=\"orient.\">výška<\/td><td data-l=\"výška\">103 m<\/td><td data-l=\"náklon\">-9.2°<\/td><td data-l=\"pohled na dům z\">SV (kamera míří JZ)<\/td><td data-l=\"proč\">Nejlepší na výšku: dům B dominantní uprostřed, nad ním pole a nebe pro titulky, pod ním louka; bazén vpravo dole, slunce 14. 11. Zleva sousední domy, dole střecha souseda. <b>Originál na výšku 3:4; ořez na 9:16 = ~75 % šířky, dům je ve středu, zůstane.<\/b><\/td><\/tr><tr><td data-l=\"#\">2<\/td><td data-l=\"snímek\">0731 (11.14.) <code>DJI_20261114120406_0731_D.DNG<\/code><\/td><td data-l=\"orient.\">výška<\/td><td data-l=\"výška\">92 m<\/td><td data-l=\"náklon\">-10.7°<\/td><td data-l=\"pohled na dům z\">SZ (kamera míří JV)<\/td><td data-l=\"proč\">Pohled od SZ, dům uprostřed, bazén a zahrada vpravo dole, nahoře nebe a Praha v dálce (titulky). Dům menší, vlevo dole zasahuje střecha sousedního objektu. <b>Originál na výšku 3:4; ořez na 9:16 doprava/do středu odstraní část sousedního objektu.<\/b><\/td><\/tr><tr><td data-l=\"#\">3<\/td><td data-l=\"snímek\">0736 (11.14.) <code>DJI_20261114120430_0736_D.DNG<\/code><\/td><td data-l=\"orient.\">výška<\/td><td data-l=\"výška\">93 m<\/td><td data-l=\"náklon\">-6.7°<\/td><td data-l=\"pohled na dům z\">SZ (kamera míří JV)<\/td><td data-l=\"proč\">Podobný pohled od SZ, nahoře volné nebe a Praha, dům uprostřed; vlevo dole velký sousední objekt a střecha vpravo (nutný ořez). <b>Originál na výšku 3:4; ořez na 9:16 do středu.<\/b><\/td><\/tr><tr><td data-l=\"#\">4<\/td><td data-l=\"snímek\">0721 (11.14.) <code>DJI_20261114120302_0721_D.DNG<\/code><\/td><td data-l=\"orient.\">výška<\/td><td data-l=\"výška\">88 m<\/td><td data-l=\"náklon\">-4.0°<\/td><td data-l=\"pohled na dům z\">SZ (kamera míří JV)<\/td><td data-l=\"proč\">Nahoře nebe s mraky a Praha (nejvíc místa na titulky), ale dům je malý a zakrytý sousedním objektem vlevo dole – spíš záložní. <b>Originál na výšku 3:4; ořez na 9:16 možný, dům zůstane malý.<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Skupina 3: Reference pro Blender + Omni<\/h4>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>#<\/th><th>snímek<\/th><th>orient.<\/th><th>výška<\/th><th>náklon<\/th><th>pohled na dům z<\/th><th>proč<\/th><\/tr><\/thead><tbody><tr><td data-l=\"#\">1<\/td><td data-l=\"snímek\">0674 (11.13.) <code>DJI_20261113160638_0674_D.DNG<\/code><\/td><td data-l=\"orient.\">šířka<\/td><td data-l=\"výška\">31 m<\/td><td data-l=\"náklon\">-18.1°<\/td><td data-l=\"pohled na dům z\">V (kamera míří Z)<\/td><td data-l=\"proč\">VÝCHOD/ulice – frontální pohled na východní fasádu a vjezd, B vpravo s bazénem. Nejlepší východní reference (vodorovně, nízko).<\/td><\/tr><tr><td data-l=\"#\">2<\/td><td data-l=\"snímek\">0675 (11.13.) <code>DJI_20261113160644_0675_D.DNG<\/code><\/td><td data-l=\"orient.\">šířka<\/td><td data-l=\"výška\">37 m<\/td><td data-l=\"náklon\">-22.6°<\/td><td data-l=\"pohled na dům z\">V (kamera míří Z)<\/td><td data-l=\"proč\">VÝCHOD-SEVEROVÝCHOD – rohový pohled od ulice, vidět východní fasádu a severní štít.<\/td><\/tr><tr><td data-l=\"#\">3<\/td><td data-l=\"snímek\">0741 (11.14.) <code>DJI_20261114120520_0741_D.DNG<\/code><\/td><td data-l=\"orient.\">šířka<\/td><td data-l=\"výška\">111 m<\/td><td data-l=\"náklon\">-28.0°<\/td><td data-l=\"pohled na dům z\">Z (kamera míří SV)<\/td><td data-l=\"proč\">ZÁPAD/zahrada – zadní fasáda, bazén; nejstrmější pohled v sadě (odhad zhruba 45–50° nad horizontem podle výšky a vzdálenosti), použitelný jako náhrada „shora“.<\/td><\/tr><tr><td data-l=\"#\">4<\/td><td data-l=\"snímek\">0686 (11.13.) <code>DJI_20261113160904_0686_D.DNG<\/code><\/td><td data-l=\"orient.\">šířka<\/td><td data-l=\"výška\">29 m<\/td><td data-l=\"náklon\">-14.4°<\/td><td data-l=\"pohled na dům z\">S (kamera míří J)<\/td><td data-l=\"proč\">SEVER – volný severní štít B, bazén vpravo, nízký pohled.<\/td><\/tr><tr><td data-l=\"#\">5<\/td><td data-l=\"snímek\">0684 (11.13.) <code>DJI_20261113160829_0684_D.DNG<\/code><\/td><td data-l=\"orient.\">šířka<\/td><td data-l=\"výška\">54 m<\/td><td data-l=\"náklon\">-16.2°<\/td><td data-l=\"pohled na dům z\">SZ (kamera míří JV)<\/td><td data-l=\"proč\">SEVEROZÁPAD – roh zahradní + severní fasády, celý dům.<\/td><\/tr><tr><td data-l=\"#\">6<\/td><td data-l=\"snímek\">0754 (11.14.) <code>DJI_20261114120756_0754_D.DNG<\/code><\/td><td data-l=\"orient.\">šířka<\/td><td data-l=\"výška\">103 m<\/td><td data-l=\"náklon\">-9.9°<\/td><td data-l=\"pohled na dům z\">SV (kamera míří JZ)<\/td><td data-l=\"proč\">VÝCHOD-SEVEROVÝCHOD z výšky ~100 m – celý dvojdům s okolím, kontrola výškových poměrů/terénu.<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Skupina 4: Lokalita / genius loci<\/h4>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>#<\/th><th>snímek<\/th><th>orient.<\/th><th>výška<\/th><th>náklon<\/th><th>pohled na dům z<\/th><th>proč<\/th><\/tr><\/thead><tbody><tr><td data-l=\"#\">1<\/td><td data-l=\"snímek\">0723 (11.14.) <code>DJI_20261114120316_0723_D.DNG<\/code><\/td><td data-l=\"orient.\">šířka<\/td><td data-l=\"výška\">88 m<\/td><td data-l=\"náklon\">-5.5°<\/td><td data-l=\"pohled na dům z\">SZ (kamera míří JV)<\/td><td data-l=\"proč\">Dům B uprostřed údolí zástavby, za ním zeleň údolí a v dálce Praha (Hrad, mrakodrapy Pankrác). Slunce, ostré.<\/td><\/tr><tr><td data-l=\"#\">2<\/td><td data-l=\"snímek\">0746 (11.14.) <code>DJI_20261114120622_0746_D.DNG<\/code><\/td><td data-l=\"orient.\">šířka<\/td><td data-l=\"výška\">125 m<\/td><td data-l=\"náklon\">-7.7°<\/td><td data-l=\"pohled na dům z\">V (kamera míří Z)<\/td><td data-l=\"proč\">Dům s polem a pastvinou za ním a Roztockým údolím; široká krajina, Praha nevidět.<\/td><\/tr><tr><td data-l=\"#\">3<\/td><td data-l=\"snímek\">0736 (11.14.) <code>DJI_20261114120430_0736_D.DNG<\/code><\/td><td data-l=\"orient.\">výška<\/td><td data-l=\"výška\">93 m<\/td><td data-l=\"náklon\">-6.7°<\/td><td data-l=\"pohled na dům z\">SZ (kamera míří JV)<\/td><td data-l=\"proč\">Na výšku: dům, nad ním údolí a siluety Prahy v dálce (Hrad, Pankrác). <b>Originál na výšku 3:4; ořez 9:16 možný.<\/b><\/td><\/tr><tr><td data-l=\"#\">4<\/td><td data-l=\"snímek\">0654 (11.13.) <code>DJI_20261113154805_0654_D.DNG<\/code><\/td><td data-l=\"orient.\">šířka<\/td><td data-l=\"výška\">60 m<\/td><td data-l=\"náklon\">-13.6°<\/td><td data-l=\"pohled na dům z\">SZ (kamera míří J)<\/td><td data-l=\"proč\">Široká krajina s polem a západem slunce, dům malý (nižší kvalita pro dům; jen jako nálada).<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Co chybí<\/h4>\n<ul>\n<li>Žádný pohled z JIHU (zakrývá ho soused A) a žádný kolmý pohled shora (největší sklon kamery -28°); nejstrmější je 0741.<\/li>\n<li>Žádný pravý soumrak s osvětleným domem; 13. 11. je západ slunce, ale dům ve stínu (0673, 0679 jen jako nebe). Soumrak půjde jen z vizualizace.<\/li>\n<li>Všechny snímky mají hotovou zahradu s trávou a vodou v bazénu, ale stavba kolem (hromady, výkopy) je viditelná – počítat s retuší.<\/li>\n<li>Vyřazeno: 3× volavka (0761–0763), krajina bez domu (0689, 0698, 0710, 0711, 0715, 0651, 0652, 0659/0660 vzdálené), tmavé/slabé (0666–0668, 0672–0673 jako dům), duplicity sérií.<\/li>\n<li>Náhledy 1600 px jsou vykresleny z DNG (embedded JPEG má jen 960 px).<\/li>\n<\/ul>", "obrazky": [{"src": "img/extra/dron/arch_skupina1.jpg", "nahled": "img/extra/dron/n_arch_skupina1.jpg", "nazev": "arch skupina1"}, {"src": "img/extra/dron/arch_skupina2.jpg", "nahled": "img/extra/dron/n_arch_skupina2.jpg", "nazev": "arch skupina2"}, {"src": "img/extra/dron/arch_skupina3.jpg", "nahled": "img/extra/dron/n_arch_skupina3.jpg", "nazev": "arch skupina3"}, {"src": "img/extra/dron/arch_skupina4.jpg", "nahled": "img/extra/dron/n_arch_skupina4.jpg", "nazev": "arch skupina4"}], "odkazy": [], "kopirovat": null, "ready": true}, {"id": "konfigurator", "nazev": "Konfigurátor z 3D modelu", "popis": "Přepínače položek na přání nad 3D modelem domu (ukázka pro web)", "md": "<p>Přesný konfigurátor z našeho 3D modelu: tři pohledy (zahrada, ulice, řez domem), základ = jen to, co je v ceně, a ke každé položce na přání vrstva ve stejném rámu (zlatě). Zapnutí položky ji ukáže přesně tam, kde v domě bude.<\/p>\n<ul>\n<li><b>10 vrstev:<\/b> fotovoltaika, tepelné čerpadlo, žaluzie, zastřešení bazénu, ohřev bazénu, wallbox, propojení FVE s písečnou baterií, chlazení, infrasauna, kuchyň.<\/li>\n<li><b>Ceny<\/b> jsou podle odpovědí p. Sládka a zatím skryté (otázka č. 7 na jeho stránce). Ukázka s cenami jen interně přes odkaz níže.<\/li>\n<li><b>Odhad polohy:<\/b> venkovní jednotka čerpadla, ohřev bazénu, wallbox a infrasauna – potvrdí p. Sládek.<\/li>\n<li>Data a obrázky jsou v datovém balíčku pro ChatGPT (<code>konfigurator<\/code>), web je převezme.<\/li>\n<\/ul>", "obrazky": [{"src": "img/extra/konfigurator/pw_02_vse_zahrada.jpg", "nahled": "img/extra/konfigurator/n_pw_02_vse_zahrada.jpg", "nazev": "pw 02 vse zahrada"}, {"src": "img/extra/konfigurator/pw_04_vse_rez.jpg", "nahled": "img/extra/konfigurator/n_pw_04_vse_rez.jpg", "nazev": "pw 04 vse rez"}, {"src": "img/extra/konfigurator/pw_03_vse_ulice.jpg", "nahled": "img/extra/konfigurator/n_pw_03_vse_ulice.jpg", "nazev": "pw 03 vse ulice"}], "odkazy": [{"text": "Otevřít ukázku konfigurátoru", "url": "https://frantisekdron.github.io/vyhlidky-podklady/natoceni-b/vyroba-b7k2q/konfigurator/"}, {"text": "Ukázka s cenami (jen interně)", "url": "https://frantisekdron.github.io/vyhlidky-podklady/natoceni-b/vyroba-b7k2q/konfigurator/?ceny=1"}], "kopirovat": null, "ready": true}, {"id": "web", "nazev": "Web domu B – náhled a zadání pro ChatGPT", "popis": "Náhled je naživo na provizorní adrese; zadání pro ChatGPT je níže", "md": "<p>Ahoj, postav nám prosím nový prodejní web pro dům B v projektu Vyhlídky Suchdol (Praha 6). Je to cílová stránka pro reklamu na Googlu a YouTube a pro QR kód na konci videa. Jediný cíl stránky: aby si lidé domluvili prohlídku s makléřkou.<\/p>\n<p>Na projektu s námi pracuje Claude (Anthropic): staví 3D model, vizualizace, konfigurátor, reklamu a web pak nasadí. Všechno, co potřebuješ, je připravené a veřejně dostupné na odkazech níže a průběžně se aktualizuje.<\/p>\n<h4>1. Podklady (nic nevymýšlej, ber jen odtud)<\/h4>\n<ul>\n<li><b>Datový balíček – jediný zdroj pravdy:<\/b> https://frantisekdron.github.io/vyhlidky-podklady/natoceni-b/vyroba-b7k2q/data/dum-b.json<\/li>\n<li><code>fakta<\/code>: cena, plochy, co je v ceně (<code>v_cene<\/code>), co na přání (<code>na_prani<\/code>), co nikdy netvrdit (<code>nikdy_netvrdit<\/code>), lokalita a dojezdy, makléřka a kontakt, značka.<\/li>\n<li><code>obrazky.fotky<\/code> (41 skutečných fotek po patrech a místnostech), <code>obrazky.vizualizace<\/code> (štítek „Vizualizace“), <code>obrazky.model3d<\/code> (3D model, řez „V ceně“, pohledy „Na přání“, půdorysy s nábytkem, pohledy na fasády), <code>obrazky.dron<\/code>, <code>obrazky.odkazy<\/code>.<\/li>\n<li><code>konfigurator<\/code>: základní cena, <code>zobrazit_ceny<\/code>, tři pohledy (<code>zahrada<\/code>, <code>ulice<\/code>, <code>rez<\/code>) se základním obrázkem a položky na přání s cenou a průhlednou PNG vrstvou ve stejném rámu.<\/li>\n<li><b>Hotová ukázka konfigurátoru<\/b> (převezmi logiku, vzhled sjednoť s webem): https://frantisekdron.github.io/vyhlidky-podklady/natoceni-b/vyroba-b7k2q/konfigurator/<\/li>\n<li><b>Náš nástřel webu z října<\/b> (navaž na něj, předělej jen pro dům B): https://frantisekdron.github.io/vyhlidky-podklady/web/<\/li>\n<li><b>Konfigurátor, který jsme ukázali majiteli<\/b> (inspirace, jak to podat jednoduše): https://frantisekdron.github.io/vyhlidky-podklady/spoluprace.html#sestavte<\/li>\n<li><b>Celá výroba<\/b> (fotky po místnostech, vizualizace, 3D model – kontext): https://frantisekdron.github.io/vyhlidky-podklady/natoceni-b/vyroba-b7k2q/<\/li>\n<li>Pokud vidíš do mého Macu: zdroj pravdy <code>~/Desktop/bordel/claude/vyhlidky-suchdol/vyroba-B/fakta.json<\/code>, značka <code>vyroba-B/strih/brand_eva.md<\/code>, konfigurátor <code>vyroba-B/konfigurator/<\/code>.<\/li>\n<\/ul>\n<h4>2. Napojení dat<\/h4>\n<p>Obsah stránky (texty z <code>fakta<\/code>, galerie, vizualizace, 3D, konfigurátor) načítej ze souboru <code>data.json<\/code> ve stejné struktuře jako <code>dum-b.json<\/code>. Nahoře v kódu konstanta <code>ZDROJ_DAT<\/code> – během vývoje může ukazovat přímo na adresu balíčku výše (GitHub Pages povoluje CORS), při spuštění ji přepneme na místní kopii. Díky tomu se nové schválené vizualizace a fotky na web dostanou bez úpravy kódu.<\/p>\n<p>Z <code>obrazky.vizualizace<\/code> používej jen položky se <code>stav<\/code> = &quot;ok&quot; a mimo skupinu „Evin vstup – obývák“ (to jsou podklady pro video). Kolo 2 vizualizací se právě dokončuje a v balíčku nahradí kolo 1.<\/p>\n<h4>3. Obsah stránky (jedna stránka, v tomto pořadí)<\/h4>\n<ol>\n<li><b>Úvod přes celou obrazovku:<\/b> místo pro video (film 16:9 doplníme – zatím vizualizace domu se zahradou a bazénem za soumraku se štítkem „Vizualizace“). Nadpis „Kde Praha končí.“ a pod ním „Dům se zahradou a bazénem v Praze 6 – Suchdol“. Cena 23 490 000 Kč. Tlačítka „Chci prohlídku“ a telefon.<\/li>\n<li><b>Čísla na jeden pohled:<\/b> 5+kk · 178 m² · pozemek 491 m² · bazén 3 × 6 m · hotovo a zkolaudováno · nastěhování do 31. 1. 2027.<\/li>\n<li><b>Galerie:<\/b> skutečné fotky a vizualizace, na rozklik přes celou obrazovku se šipkami a swipe. U místností, kde máme obojí, přepínač s posuvníkem „Dnes / Vizualizace“. Každý AI obrázek má viditelný štítek „Vizualizace“ a u galerie větu „Zařízení je návrh, není součástí dodávky.“<\/li>\n<li><b>Dům ve 3D:<\/b> řez domem „V ceně“ a pohled „Na přání“ (obrázky s popisky z <code>obrazky.model3d<\/code>). Pod tím dva krátké seznamy V ceně / Na přání – bez cen.<\/li>\n<li><b>Sestavte si dům B (konfigurátor):<\/b> jednoduše, bez přehlcení. Nahoře pevně „V ceně“, pod tím položky na přání jako přepínače; obraz = 3D model, zapnutá položka přidá svou vrstvu ve stejném pohledu a pohled se sám přepne. Položky s <code>vyzaduje<\/code> zapnou i to, co potřebují. Dole souhrn: 23 490 000 Kč + vybrané příplatky = orientačně celkem, a tlačítko „Poslat mi tuto sestavu“ (předvyplní formulář s_evou": ""}, {"id": "v07", "foto": "img/foto/P1194788.jpg", "viz": "img/viz/07_P1194788_viz.jpg", "nazev": "Zahrada s bazénem – den", "stav": "ok", "poznamka": "Bazén napuštěný, plachta a modrá krycí deska pryč (dlažba pokračuje), zábradlí B bez fólií jako u A. Dům, sousedé a obloha beze změny (vizuálně). Žádné zadní schodiště.", "rozmisteni": "exteriér – bez výkresu", "skupina": "Místnosti a zahrada", "s_evou": ""}, {"id": "v08", "foto": "img/foto/P1194788.jpg", "viz": "img/viz/08_P1194788_soumrak_viz.jpg", "nazev": "Zahrada s bazénem – soumrak", "stav": "ok", "poznamka": "Stejný nábytek a výsadba jako den.", "rozmisteni": "exteriér – bez výkresu", "skupina": "Místnosti a zahrada", "s_evou": ""}, {"id": "v09", "foto": "img/foto/P1194790.jpg", "viz": "img/viz/09_P1194790_viz.jpg", "nazev": "Fasáda a bazén zblízka – den", "stav": "ok", "poznamka": "Jako #7, bližší pohled; zábradlí bez fólií.", "rozmisteni": "exteriér – bez výkresu", "skupina": "Místnosti a zahrada", "s_evou": ""}, {"id": "v10", "foto": "img/foto/P1194931.jpg", "viz": "img/viz/10_P1194931_viz.jpg", "nazev": "Obývací prostor – od schodiště k terase", "stav": "vyhrady", "poznamka": "Pokus 1 přestavěl místnost (nová okna, ostrov v popředí) = neprošlo; pokus 2 stůl natočený ke kameře; finál = pokus 3 (stůl osou S–J, sedačka zády). Ověřit očima, že sedí s #1. Skript: posun rámu ~26 px / pokrytí 96 % (nezarovnáno – homografie by doplnila 7 %, jen ořez). 3 pokusy vyčerpány.", "rozmisteni": "podle výkresu b_06", "skupina": "Místnosti a zahrada", "s_evou": ""}, {"id": "v11", "foto": "img/foto/P1194950.jpg", "viz": "img/viz/11_P1194950_viz.jpg", "nazev": "Obývací prostor – ke schodišti a kuchyni", "stav": "vyhrady", "poznamka": "Kuchyňská linka vlevo, ostrov u pilíře mezi východními okny se 2 židlemi, stůl pro 6 osou S–J. Sedací zóna v popředí vlevo – trojsedák natočený spíš k severu než k západu. Skript: horní hrany zábradlí/madla posunuté ~10 px.", "rozmisteni": "odchylka: komoda u schodiště místo JZ rohu; s dy řadového domu C/D/E podle situace b_03 (zhruba): nízké ploty/živé ploty mezi zahradami, u každé terasa u domu a bazén ~3 × 6 m; řadový dům je za levým okrajem. Schodiště B odsud vidět není (je za domem na straně ulice).", "rozmisteni": "staging_venku.json (stejná sada pro všechny snímky)", "skupina": "Kolo 2 – exteriéry", "s_evou": ""}, {"id": "v21", "foto": "img/viz/21_foto.jpg", "viz": "img/viz/21_dron_0752_viz2.jpg", "nazev": "Kolo 2 · Z dronu – na výšku", "stav": "ok", "poznamka": "3. verze. 1. pokus přidal na severní štít B balkony s nábytkem (zahradní terasy z tohoto pohledu vidět nejsou) → oprava; 2. verze dala živý plot na zadní (západní) hranici → oprava. Teď: štít čistý, plot podél severní hranice, lehátka mezi bazénem a plotem, haldy pryč, sad v pozadí uklizený. Výhrada: bazén vyšel o něco větší a ~30 px posunutý, z okraje západní terasy zbyl jen náznak. Rám = originál. | v2 (15. 11. večer, Franta): do hotové v1 vložené jen změněné oblasti (maska, v2/0752_maska.png; v1 = final/dron_0752_viz2_v1.jpg): bazén zmenšený a posunutý na místo bazénu z originálu (3 × 6 m), lehátka/stolek/slunečník/květináč s ním; znovu je vidět roh západních teras B (sklo se sloupky); doplněné venkovní schodiště B ze severního konce východního balkonu 1.NP dolů podél domu (zrcadlově jako u A, částečně za jehličnanem); trávník vpravo za živým plotem = zahrada C s nízkým plotem a rohem terasy. Výhrada z v1 (bazén) vyřešena.", "rozmisteni": "staging_venku.json (stejná sada pro všechny snímky)", "skupina": "Kolo 2 – exteriéry", "s_evou": ""}, {"id": "v22", "foto": "img/viz/22_foto.jpg", "viz": "img/viz/22_dron_0743_viz2.jpg", "nazev": "Kolo 2 · Z dronu – od ulice", "stav": "ok", "poznamka": "2. verze se zjednodušeným zadáním (jen úklid): 1. pokus přestavěl okolí (zahradu s bazénem dal na sousedův pozemek, pokácel stromy). Teď: sousední pozemek vpravo od B uklizený na trávník, živý plot podél severní hranice B, viditelný roh bazénu s vodou, stromy a domy na místě. Vybavení odsud vidět není. Rám = originál (636 bodů). | v2 (15. 11. večer, Franta): do hotové v1 vložené jen změněné oblasti (maska, v2/0743_maska.png; v1 = final/dron_0743_viz2_v1.jpg): trávník mezi živým plotem B a řadovým domem C–D–E rozdělen na 3 zahrady (C nejblíž, E nejdál) s nízkými živými ploty, terasou a bazénem; doplněné schodiště B u pravého (severního) konce uličního balkonu dolů podél domu.", "rozmisteni": "staging_venku.json (stejná sada pro všechny snímky)", "skupina": "Kolo 2 – exteriéry", "s_evou": ""}, {"id": "v23", "foto": "img/viz/23_foto.jpg", "viz": "img/viz/23_dron_0724_viz2.jpg", "nazev": "Kolo 2 · Z dronu – lokalita s Prahou", "stav": "ok", "poznamka": "2. verze (1 oprava): 1. verze dala plot a lehátka na jižní stranu bazénu. Teď plot před bazénem (severní hranice), lehátka mezi bazénem a plotem, okolní staveniště uklizené (trampolína souseda zůstala), zaparkovaná auta pryč, Praha na obzoru beze změny. 5. židli za stolem jsem vyretušoval lokálně (tools/retus_0724.py); teď 4 židle. Rám = originál (145 bodů). | v2 (15. 11. večer, Franta): do hotové v1 vložené jen změněné oblasti (maska, v2/0724_maska.png; v1 = final/dron_0724_viz2_v1.jpg): trávník s trampolínou mezi řadovým domem a živým plotem B rozdělen na zahrady s ploty, terasou u řadového domu a bazény (trampolína pryč); schodiště B doplněné u levého (východního) rohu štítu – vidět je jen horní část nad střechou řadového domu, sklon ramene od AI (orientační).", "rozmisteni": "staging_venku.json (stejná sada pro všechny snímky)", "skupina": "Kolo 2 – exteriéry", "s_evou": ""}, {"id": "v24", "foto": "img/foto/P1194937.jpg", "viz": "img/viz/24_P1194937_viz2.jpg", "nazev": "Kolo 2 · Obývák – hlavní pohled", "stav": "vyhrady", "poznamka": "Hlavní pohled podle 3D scény: kuchyň do stropu (ořechové vysoké skříně, horní skříňky), nízký světlý ostrov se 2 viditelnými židlemi v pravém popředí, L-sedačka zády ke kameře čelem k prosklení, odkládací stolek s lampou, olivovník v SZ rohu, obraz na stěně haly, svítidla. ODCHYLKA: jídelní stůl je natočený o 90° (osa V–Z místo S–J) a vedle SZ okna je malý obraz navíc. Pokus 1 (se stylovou referencí) přestavěl záběr, pokus 3 (2 varianty, raw/_pokus3a/b) má stůl správně, ale sedačku obráceně a komodu s fíkusem na stěně haly – vybrán pokus 2. Rám: ořez, hrany stavby na místě 85 %. Zábradlí terasy za prosklením opraveno na čisté sklo jako dům A (retuš ChatGPT vložená jen do pásu zábradlí, zbytek beze změny; verze ve fólii *_viz2_folie.jpg).", "rozmisteni": "3D scéna Staging_obyvak (výkres b_06 + Evina trasa)", "skupina": "Kolo 2 – interiéry", "s_evou": ""}, {"id": "v25", "foto": "img/foto/P1194931.jpg", "viz": "img/viz/25_P1194931_viz2.jpg", "nazev": "Kolo 2 · Obývák – od kuchyně k terase", "stav": "ok", "poznamka": "Z kuchyně k terase: nízký světlý ostrov vlevo dole, vysoká ořechová kuchyň vpravo, stůl pro 6 osou S–J (3+3 židle), L-sedačka za ním čelem k prosklení, komoda s lampou a obrazem u schodiště, obraz u schodiště i na stěně haly (3 obrazy), fíkus, olivovník v SZ rohu. Pokus 1 (s P1194937 jako referencí) převzal natočený stůl – pokus 2 bez reference. Rám: ořez, hrany stavby 71 %. Zábradlí terasy za prosklením opraveno na čisté sklo jako dům A (retuš ChatGPT vložená jen do pásu zábradlí, zbytek beze změny; verze ve fólii *_viz2_folie.jpg).", "rozmisteni": "3D scéna Staging_obyvak", "skupina": "Kolo 2 – interiéry", "s_evou": ""}, {"id": "v26", "foto": "img/foto/P1194950.jpg", "viz": "img/viz/26_P1194950_viz2.jpg", "nazev": "Kolo 2 · Obývák – ke kuchyni a schodišti", "stav": "ok", "poznamka": "Ke kuchyni a schodišti: L-sedačka čelem ke kameře s krátkou částí vlevo, travertinový stolek, odkládací stolek s lampou u schodiště, stůl S–J s židlemi, ostrov s židlemi, kuchyň do stropu vlevo (obě vysoké skříně), obraz u schodiště a na stěně haly. Vybrána varianta a (b má olivovník navíc vlevo – raw/P1194950_b.png). Rám: ořez.", "rozmisteni": "3D scéna Staging_obyvak", "skupina": "Kolo 2 – interiéry", "s_evou": ""}, {"id": "v27", "foto": "img/viz/27_foto.jpg", "viz": "img/viz/27_eva_obyvak_viz2.jpg", "nazev": "Kolo 2 · Obývák – Evin vstup", "stav": "vyhrady", "poznamka": "Evin záběr (čistý snímek P1194965, 13,0 s) se stejnými kusy: stůl S–J v popředí, L-sedačka zády, krátká část vpravo, komoda s lampou a obrazem, obraz u schodiště, fíkus, olivovník v SZ rohu vpravo od Evy; pás podél prosklení volný. Pokus 1 posunul konferenční stolek k prosklení (do Eviny trasy) a přidal obraz na pilíř – opraveno v pokusu 2. VÝHRADA: ChatGPT i tak zesvětlil a oteplil scénu proti šedému V-Log převodu (Eva v náhledu působí tmavěji). Rám: homografie 27 bodů, hrany stavby 93 %. Náhled s Evou orientační (nábytek zakrývá ~12 % postavy). Zábradlí terasy za prosklením opraveno na čisté sklo jako dům A (retuš ChatGPT vložená jen do pásu zábradlí, zbytek beze změny; verze ve fólii *_viz2_folie.jpg).", "rozmisteni": "3D scéna Staging_obyvak – Evin koridor volný", "skupina": "Kolo 2 – interiéry", "s_evou": "img/viz/27_s_evou.jpg"}, {"id": "v28", "foto": "img/foto/P1194836.jpg", "viz": "img/viz/28_P1194836_viz2.jpg", "nazev": "Kolo 2 · Ložnice", "stav": "ok", "poznamka": "Interiér jako schválené kolo 1; zábradlí balkonu jako dům A (antracitové sloupky a madlo, čiré sklo bez fólie); na balkoně 2 teakové křesla, stolek a květináče s hortenziemi, levandulí a trávami. Rám: homografie, svislice 0,5°.", "rozmisteni": "jako kolo 1 (výkres b_08) + balkon", "skupina": "Kolo 2 – interiéry", "s_evou": ""}, {"id": "v29", "foto": "img/foto/P1194864.jpg", "viz": "img/viz/29_P1194864_viz2.jpg", "nazev": "Kolo 2 · Pokoj SV", "stav": "ok", "poznamka": "Vybaveno jako ložnice: postel 140 s čalouněným čelem u střední stěny (vidět), noční stolek s lampou, stůl se židlí u okna, koberec, obraz; dubové dveře (otevřené, závěs vpravo) s dubovou zárubní ve stejném odstínu jako zárubeň v P1194886; zábradlí jako dům A; na terase květináče s hortenziemi, levandulí a trávami. Postel je proti výkresu b_08 jinde (Franta: má být vidět). Rám: homografie, svislice 0,3°.", "rozmisteni": "Franta: postel vidět (odchylka od b_08)", "skupina": "Kolo 2 – interiéry", "s_evou": ""}, {"id": "v30", "foto": "img/foto/P1194886.jpg", "viz": "img/viz/30_P1194886_viz2.jpg", "nazev": "Kolo 2 · Pokoj JV", "stav": "ok", "poznamka": "Interiér jako kolo 1; zárubně po stranách hotové dubové; žebřík pryč; na terase 2 křesla se stolkem a trávy v květináčích; zábradlí jako dům A. Rám: ořez.", "rozmisteni": "jako kolo 1 (výkres b_08)", "skupina": "Kolo 2 – interiéry", "s_evou": ""}, {"id": "v31", "foto": "img/foto/P1184133.jpg", "viz": "img/viz/31_P1184133_viz2.jpg", "nazev": "Kolo 2 · Místnost u terasy 1.PP", "stav": "ok", "poznamka": "Interiér jako kolo 1; zásobník vody schovaný ve vestavné skříni do stropu (fronty jako kuchyňka); venku místo drátěného plotu hustý živý plot, haldy na sousedním pozemku nejsou vidět. Rám: homografie (měřítko 0,92), svislice 0,2° – posoudit okraj vlevo.", "rozmisteni": "jako kolo 1 (b_09, bez sauny)", "skupina": "Kolo 2 – interiéry", "s_evou": ""}, {"id": "v32", "foto": "img/foto/P1194906.jpg", "viz": "img/viz/32_P1194906_viz2.jpg", "nazev": "Kolo 2 · Koupelna 2.NP", "stav": "ok", "poznamka": "Hotová koupelna: předstěna i nika na původním místě (nika začíná až za schodkem předstěny), WC pod tlačítkem, walk-in sprcha vlevo vpředu nad žlabem s čirou zástěnou mezi sprchou a WC, mosazná dešťová sprcha a baterie, vana pod oknem, na pravé stěně dvojumyvadlo (2 umyvadla) s ořechovou skříňkou a zrcadlem; krabice a modré desky pryč. Rám: ořez (obklad = málo shod).", "rozmisteni": "výkres b_08: walk-in sprcha, 2 umyvadla", "skupina": "Kolo 2 – interiéry", "s_evou": ""}, {"id": "v33", "foto": "img/viz/33_foto.jpg", "viz": "img/viz/33_dron_0741_k3_A.jpg", "nazev": "Kolo 3 · Z dronu – zahrada · varianta A – Střídmá", "stav": "ke schválení", "poznamka": "Z originální fotky DJI_0741; kamera kalibrovaná v Blenderu proti modelu (f 70 mm z EXIF, chyba 4.2 px z 2560). Bazén B zamčený na obrys z originálu (voda jen uvnitř; kontrola: voda víc než 2 px mimo obrys 0 px, zbytky plachty uvnitř 0 px z 28116 px; technický poklop v barvě dlažby). Hranice zahrad z katastru (KN 74/15 + 74/16), dělení C/D/E podle situace b_03. Varianta A: zahrady C/D/E jen trávník s terasou, nízké ploty, mladé stromy; živý plot B 1,8 m. Schodiště B z tohoto pohledu není vidět (je na uliční straně). Vybavení u bazénu doplněno druhým průchodem (2 lehátka, stolek, slunečník, květináč). | v4 (Franta): zahrady C/D/E předělané podle schváleného dělení ze srovnávacího listu (3D scéna model3d/okoli/okoli_CDE.blend, masky z ní); C = jedna velká zahrada, D úzký pruh, E roh; v E žádný bazén; mimo masky zahrad beze změny. Slunečník B opraven (celý z podkladu).", "rozmisteni": "", "skupina": "Kolo 3 – vyber variantu: Dron 0741", "s_evou": ""}, {"id": "v34", "foto": "img/viz/34_foto.jpg", "viz": "img/viz/34_dron_0741_k3_B.jpg", "nazev": "Kolo 3 · Z dronu – zahrada · varianta B – Zabydlená", "stav": "ke schválení", "poznamka": "Z originální fotky DJI_0741; kamera kalibrovaná v Blenderu proti modelu (f 70 mm z EXIF, chyba 4.2 px z 2560). Bazén B zamčený na obrys z originálu (voda jen uvnitř; kontrola: voda víc než 2 px mimo obrys 0 px, zbytky plachty uvnitř 0 px z 28116 px; technický poklop v barvě dlažby). Hranice zahrad z katastru (KN 74/15 + 74/16), dělení C/D/E podle situace b_03. Varianta B: C bazén + terasa, D pergola s posezením, E ovocné stromy a dětský koutek; živý plot B 2,5 m. Schodiště B z tohoto pohledu není vidět (je na uliční straně). Vybavení u bazénu doplněno druhým průchodem (2 lehátka, stolek, slunečník, květináč). | v4 (Franta): zahrady C/D/E předělané podle schváleného dělení ze srovnávacího listu (3D scéna model3d/okoli/okoli_CDE.blend, masky z ní); C = jedna velká zahrada, D úzký pruh, E roh; v E žádný bazén; mimo masky zahrad beze změny. Slunečník B opraven (celý z podkladu).", "rozmisteni": "", "skupina": "Kolo 3 – vyber variantu: Dron 0741", "s_evou": ""}, {"id": "v35", "foto": "img/viz/35_foto.jpg", "viz": "img/viz/35_ ště<\/td><td data-l=\"z čeho\">objímky VZT pod stropem garáže (P1184094)<\/td><td data-l=\"nejistota\">poloha neznámá<\/td><td data-l=\"dopad na video\">střední (scéna V ceně)<\/td><\/tr><tr><td data-l=\"#\">6<\/td><td data-l=\"co\"><b>Venkovní schodiště na balkon 1.NP<\/b><\/td><td data-l=\"hodnota v modelu\">podle b_05 na severním konci balkonu<\/td><td data-l=\"z čeho\">výkres + zadání; na fotkách 14. 11. u B není<\/td><td data-l=\"nejistota\">poloha<\/td><td data-l=\"dopad na video\">malý–střední<\/td><\/tr><tr><td data-l=\"#\">7<\/td><td data-l=\"co\">Tvar vnitřních schodišť<\/td><td data-l=\"hodnota v modelu\">rovné rameno v zóně z výkresu (reálně se zákruty)<\/td><td data-l=\"z čeho\">výkresy, fotky<\/td><td data-l=\"nejistota\">tvar<\/td><td data-l=\"dopad na video\">malý (jen řezy)<\/td><\/tr><tr><td data-l=\"#\">8<\/td><td data-l=\"co\">Garážová vrata<\/td><td data-l=\"hodnota v modelu\">3,0 m (výkres 3,7 m)<\/td><td data-l=\"z čeho\">fotky<\/td><td data-l=\"nejistota\">±0,4 m<\/td><td data-l=\"dopad na video\">malý<\/td><\/tr><tr><td data-l=\"#\">9<\/td><td data-l=\"co\">Plochy: garsonka vychází 10,7 m² proti 13,74 m² ve výkresu; balkon 2.NP V vychází 16 m² proti 10 m²<\/td><td data-l=\"hodnota v modelu\">výkres nesedí sám se sebou<\/td><td data-l=\"z čeho\"><\/td><td data-l=\"nejistota\">malý (obrys domu sedí)<\/td><\/tr><tr><td data-l=\"#\">10<\/td><td data-l=\"co\">Pootočení domu vůči světovým stranám<\/td><td data-l=\"hodnota v modelu\">nezadáno<\/td><td data-l=\"z čeho\"><\/td><td data-l=\"nejistota\"><\/td><td data-l=\"dopad na video\">pro kamery podle dronu a slunce<\/td><\/tr><tr><td data-l=\"#\">11<\/td><td data-l=\"co\">Budoucí FVE, TČ, žaluzie, zastřešení bazénu<\/td><td data-l=\"hodnota v modelu\">návrh rozmístění<\/td><td data-l=\"z čeho\">odpovědi 9. 11. (ceny)<\/td><td data-l=\"nejistota\">umístění<\/td><td data-l=\"dopad na video\">střední (scéna Na přání)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Měřítka výkresů (z ploch místností): b_04 75,9 px/m (rozptyl 73–78), b_05 78,5 (obývák 48,8 m² sedí na −0,7 %), b_07 76,5 (74,9–80,8).<\/p>\n<p>Výsledný dům 10,30 × 7,10 m, rozdíl mezi výkresy ±1 %. Místnosti: garáž −0,9 %, obývák −0,7 %, ložnice +0,4 %, koupelna 2.NP −1,2 %,<\/p>\n<p>pokoje −3,8 % / +3,4 %, chodba 1.PP +2,2 %, koupelna 1.PP +4 %, zádveří −7,5 %, garsonka −22 % (viz bod 9).<\/p>\n<h4>Suterén (1.PP) – co na něm podle fotek a dronu je (k ověření u p. Sládka)<\/h4>\n<ul>\n<li><b>Technický kout s kotlem<\/b>: nástěnný plynový kotel v nice v garáži u stěny ke garsonce (P1184110, P1184094, P1184098); u něj<\/li>\n<\/ul>\n<p>  rozvody, expanzomat, rozvaděč/zásuvky. Ve výkresu b_04 je tato nika bílý obdélník, ve 3D pohledu b_09 je na stejném místě <b>sauna<\/b>.<\/p>\n<ul>\n<li><b>Sauna – příprava?<\/b> V nice garáže stojí karton s piktogramem sauny (P1184094, P1184098). Infrasauna podle odpovědí NENÍ v ceně<\/li>\n<\/ul>\n<p>  („cca 40 000 Kč“). <b>Otázka: má být sauna v nice (jako b_09), nebo v garsonce? Je tam připravená elektřina?<\/b><\/p>\n<ul>\n<li><b>Zásobník teplé vody<\/b>: bílý válcový zásobník volně stojí v garsonce u dveří (P1184133, P1184138). **Otázka: je to jeho konečné<\/li>\n<\/ul>\n<p>  místo, nebo se přesune do technické niky?**<\/p>\n<ul>\n<li><b>Rekuperace<\/b>: pod stropem garáže jsou kruhové objímky a vývody VZT (P1184094, P1184104) – jednotku Licon jsme proto dali<\/li>\n<\/ul>\n<p>  pod strop garáže. <b>Otázka: kde přesně bude jednotka a kudy vedou sání a výfuk?<\/b><\/p>\n<ul>\n<li>Garáž: sekční vrata s pohonem (P1184104), betonová podlaha; zádveří se vstupem z dvora (P1184089); koupelna se sprchou a WC<\/li>\n<\/ul>\n<p>  (P1184118, sanita v obalech); chodba se schodištěm (P1184145).<\/p>\n<ul>\n<li>Kde je <b>elektrorozvaděč<\/b>? Na fotkách jsou rozvaděče v chodbě 2.NP (P1194851) – v modelu tam je Loxone.<\/li>\n<\/ul>\n<h4>Podklady, o které požádat p. Sládka (a k čemu)<\/h4>\n<ol>\n<li><b>Okótované půdorysy všech podlaží (PDF/DWG)<\/b> – přesné zdi a otvory místo odvození z ploch (dnes ±1 %, místy výkres nesedí sám se sebou).<\/li>\n<li><b>Řez domem (příčný i podélný) s výškovými kótami<\/b> – výšky podlaží, tloušťky stropů, výška okapu a hřebene; scéna „řez domem“ a titulky.<\/li>\n<li><b>Pohledy na všechny 4 fasády<\/b> – kontrola oken (parapety, nadpraží), tvaru střechy a štítů.<\/li>\n<li><b>Skladba a sklon střechy<\/b> – tloušťka, sklon, atika/oplechování; nutné pro rozmístění FVE ve scéně „Na přání“.<\/li>\n<li><b>Písečná baterie: kde přesně pod domem, rozměry, hloubka, jak je napojená (registr, teplota)<\/b> – hlavní efekt scény „Dům ve 3D“.<\/li>\n<li><b>Umístění rekuperační jednotky, trasy VZT, výústky<\/b> – animace rozvodů.<\/li>\n<li><b>Umístění kotle, zásobníku TUV, rozvaděče a Loxone<\/b> – popisky „V ceně“.<\/li>\n<li><b>Kde bude tepelné čerpadlo (venkovní jednotka) a kudy kabely FVE k baterii a střídači<\/b> – scéna „Na přání“.<\/li>\n<li><b>Situace / výškopis pozemku (hranice, výškové kóty dvora, zahrady, ulice, poloha bazénu)<\/b> – terén v modelu a kamery na zahradě.<\/li>\n<li><b>Potvrzení venkovního schodiště od ulice na balkon 1.NP (poloha, kdy bude hotové)<\/b> – na fotkách 14. 11. zatím není.<\/li>\n<li><b>Výška a typ zábradlí (shodné s A)<\/b> a <b>typ zastřešení bazénu a žaluzií<\/b> – vzhled ve scénách.<\/li>\n<li><b>Sauna: kde (nika v garáži, nebo garsonka) a co je připravené<\/b> – viz suterén.<\/li>\n<\/ol>", "porovnani": "<h3>Dům B – kontrola modelu proti skutečným fotkám (15. 11. 2026)<\/h3>\n<p>Kamera ke každé fotce je dopočítaná z bodů na fasádě (PnP: rohy roletových boxů, okenní rámy, hrany balkonových desek, rohy okapu<\/p>\n<p>→ jejich 3D poloha z <code>plan.json<\/code>). Pak je model vyrenderovaný ze stejného místa a položený přes fotku.<\/p>\n<p>Listy: <code>porovnani/&lt;fotka&gt;_porovnani.jpg<\/code> (fotka | model | prolnutí | tmavé hrany modelu přes fotku, zelená = bod na fotce, červená = bod modelu).<\/p>\n<p>Kamery: <code>porovnani/kamery.json<\/code>. Fotky jsou z Fotella po korekci svislic → nejsou to čisté „dírkové“ snímky, proto zbývá chyba.<\/p>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>fotka<\/th><th>co ukazuje<\/th><th>chyba kamery (RMS z 2560 px)<\/th><th>verdikt<\/th><\/tr><\/thead><tbody><tr><td data-l=\"fotka\"><b>P1194788<\/b> západní fasáda se zahradou<\/td><td data-l=\"co ukazuje\">1.PP/1.NP/2.NP, terasy, sloupy, střecha z boku<\/td><td data-l=\"chyba kamery (RMS z 2560 px)\">16 px (≈ 0,6 %)<\/td><td data-l=\"verdikt\"><b>dům sedí<\/b> – podlaží, okna, desky balkonů, sloupy, okap; <b>terén a bazén nesedí<\/b><\/td><\/tr><tr><td data-l=\"fotka\"><b>P1194771<\/b> severní štít<\/td><td data-l=\"co ukazuje\">2 okna 1.NP, komínek, štít<\/td><td data-l=\"chyba kamery (RMS z 2560 px)\">6 px (≈ 0,25 %)<\/td><td data-l=\"verdikt\"><b>sedí velmi dobře<\/b> – okna ±3 px, roh okapu ±3 px<\/td><\/tr><tr><td data-l=\"fotka\"><b>P1194761<\/b> od ulice (SV roh)<\/td><td data-l=\"co ukazuje\">garáž, východní balkony, štít<\/td><td data-l=\"chyba kamery (RMS z 2560 px)\">36 px<\/td><td data-l=\"verdikt\">jen orientačně – fotka je silně deformovaná (15 mm + korekce), kamera nejde přesně spočítat<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Co sedí<\/h4>\n<ul>\n<li><b>Půdorys / rozměr domu 10,30 × 7,10 m<\/b> – okna na severní a západní fasádě padnou na fotku do ±0,3 m vodorovně.<\/li>\n<li><b>Výšky podlaží<\/b>: roletové boxy nad okny 1.PP, 1.NP a 2.NP jsou na P1194788 ve stejných rozestupech (207 a 211 px) → podlahy<\/li>\n<\/ul>\n<p>  ±0,00 / +3,00 / +6,15 m; svislé odchylky bodů do 8 px (≈ 10 cm).<\/p>\n<ul>\n<li><b>Okap +9,20 m<\/b>: dvě nezávislé fotky (P1194788 i P1194771) dávají nejmenší chybu při okapu 9,1–9,4 m.<\/li>\n<li><b>Střecha<\/b>: sedlová, hřeben S–J uprostřed, štít na severu – sedí na P1194771 (šikmá hrana štítu k SZ rohu) i na dronu<\/li>\n<\/ul>\n<p>  (nataceni 2, LRF 0742 12–24 s: dvě sedlové střechy A a B, hřeben u obou S–J). Rendery developera b_00–02 mají jiný tvar – nepoužity.<\/p>\n<ul>\n<li><b>Okna<\/b>: 1.NP sever 2 velká okna (sloupek s komínkem mezi nimi), západ 1.NP celá prosklená stěna, 2.NP západ velké francouzské<\/li>\n<\/ul>\n<p>  okno ložnice + malé okno koupelny, 1.PP západ okno + dveře garsonky + okno koupelny (parapety 1,05 m – P1184133, P1184118);<\/p>\n<p>  severní štít 1.PP a 2.NP bez oken. Počty souhlasí na všech fotkách.<\/p>\n<ul>\n<li><b>Balkony a terasy<\/b>: západní terasa 1.NP na dvou sloupech, balkon 2.NP nad ní, desky ve správných výškách; východní balkony<\/li>\n<\/ul>\n<p>  (lichoběžník podél ulice) odpovídají dronu i P1194761.<\/p>\n<ul>\n<li><b>Komínek<\/b> (nerez, odkouření kotle) uprostřed mezi okny severní fasády, nad střechu.<\/li>\n<\/ul>\n<h4>Co nesedí / je nejisté<\/h4>\n<ol>\n<li><b>Terén zahrady a bazén (P1194788)<\/b> – v modelu je bazén menší a dál od kamery než na fotce. Z kamery vychází, že fotograf stál<\/li>\n<\/ol>\n<p>   ~4–5 m nad podlahou 1.PP, tedy zahrada k západu stoupá (v modelu +0,8 → +2,6 m, odhad). Poloha bazénu je z dronu (±0,7 m), na fotce<\/p>\n<p>   se nedá spolehlivě dopočítat, protože není znám sklon terénu. <b>Pro záběry zahrady potřebujeme výškopis/situaci (viz CHYBI.md).<\/b><\/p>\n<ol>\n<li><b>Venkovní schodiště od ulice na balkon 1.NP<\/b> – v modelu podle výkresu b_05 a zadání (Franta 15. 11.: „skutečný stav“) na<\/li>\n<\/ol>\n<p>   severním konci balkonu. <b>Na fotkách 14. 11. (P1194761) ani na dronu (0742_21) u domu B zatím není<\/b>; podobné schodiště má<\/p>\n<p>   dům A na svém jižním konci. Nutno potvrdit polohu u p. Sládka.<\/p>\n<ol>\n<li><b>Dům A<\/b> je jen hmota (o 0,4 m nižší, 1,3 m vystupuje k ulici, 2 m kratší do zahrady) – na fotkách má A vlastní terasy a sloupy.<\/li>\n<li><b>Zábradlí<\/b> – v modelu už „jako dům A“ (antracitové sloupky, madlo, čiré sklo). Na fotkách je u B zatím zabalené ve fólii.<\/li>\n<li><b>Garážová vrata<\/b> – výkres kreslí otvor 3,7 m, fotky ukazují užší → v modelu 3,0 m (odhad).<\/li>\n<li><b>Sklon střechy<\/b> (~12°, hřeben +10,30) je z dronu a jedné fotky; ±0,3 m.
